# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# ANDROID APK - CAPACITOR
#
# FITUR:
# - Website internal HSM Transport
# - Dashboard Admin
# - Portal Sopir & Kernet
# - Splash Screen 3 Detik
# - Ikon Resmi HSM
# - Navigasi Back Android
# - Izin Kamera QR Scanner
# - Izin Getaran Android
# - Suara Scanner Native Android
# - Getaran Scanner Native Android
# - Tombol Tes Suara & Getaran
#
# SUARA:
# BERHASIL = 1 BUNYI
# GAGAL    = 3 BUNYI
#
# WEBSITE VERCEL TIDAK DIMODIFIKASI
#
# OUTPUT:
# HSM-Transport.apk
#
# BUILD DEBUG UNTUK PENGUJIAN
# ============================================================

name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ======================================================
      # 3. SETUP JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ======================================================
      # 4. SETUP ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "false"
          packages: ""


      # ======================================================
      # 5. TERIMA LISENSI ANDROID
      # ======================================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail

          yes | sdkmanager --licenses > /dev/null

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "Gagal menerima lisensi Android SDK."
            exit "$result"
          fi

          echo "Lisensi Android SDK berhasil."


      # ======================================================
      # 6. INSTALL ANDROID PLATFORM
      # ======================================================

      - name: Install Android Platform
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"


      # ======================================================
      # 7. SALIN WEBSITE HSM KE APK
      # ======================================================

      - name: Prepare HSM Website
        shell: bash
        run: |
          mkdir -p android-app/www

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json
          do
            if [ -f "$file" ]; then
              cp "$file" android-app/www/
            fi
          done

          echo "Memeriksa file website..."

          test -f android-app/www/index.html
          test -f android-app/www/admin.html
          test -f android-app/www/petugas.html
          test -f android-app/www/config.js
          test -f android-app/www/app.js

          echo "Website HSM siap."


      # ======================================================
      # 8. BUAT PORTAL INTERNAL
      # ======================================================

      - name: Prepare APK Internal Portal
        shell: bash
        run: |
          if [ ! -f android-app/www/portal.html ]; then

            cat > android-app/www/portal.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <meta
              name="theme-color"
              content="#0754a6"
            >

            <title>
              Portal Internal HSM Transport
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                font-family: Arial,sans-serif;
                background: #f4f7fb;
                display: flex;
                align-items: center;
                justify-content: center;
              }

              .card {
                width: 100%;
                max-width: 440px;
                padding: 28px 22px;
                background: white;
                border-radius: 18px;
                text-align: center;
                box-shadow:
                  0 8px 28px rgba(0,0,0,.08);
              }

              h1 {
                color: #0754a6;
                font-size: 24px;
              }

              p {
                color: #64748b;
                line-height: 1.7;
              }

              a {
                display: block;
                margin-top: 14px;
                padding: 15px;
                border-radius: 11px;
                background: #0754a6;
                color: white;
                font-weight: bold;
                text-decoration: none;
              }

              a.secondary {
                background: #e2e8f0;
                color: #334155;
              }

            </style>

          </head>

          <body>

            <main class="card">

              <h1>
                HSM Transport
              </h1>

              <p>
                Portal Internal
                <br>
                PT Hidayah Sarana Mulia
              </p>

              <a href="admin.html">
                🔐 Dashboard Admin
              </a>

              <a href="petugas.html">
                🚐 Portal Sopir & Kernet
              </a>

              <a
                href="index.html"
                class="secondary"
              >
                Kembali ke Penumpang
              </a>

            </main>

          </body>

          </html>
          HTML

          fi

          echo "Portal internal APK siap."


      # ======================================================
      # 9. TAMBAH AKSES INTERNAL
      # ======================================================

      - name: Add APK Internal Access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android-app/www/index.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          marker = "hsm-apk-internal-access"

          if marker not in html:

              link = '''
          <div
            id="hsm-apk-internal-access"
            style="
              text-align:center;
              padding:16px;
              background:#f5f7fa;
            "
          >
            <a
              href="portal.html"
              style="
                color:#64748b;
                font-size:12px;
                text-decoration:none;
              "
            >
              🔐 Akses Internal HSM
            </a>
          </div>
          '''

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag body tidak ditemukan."
                  )

              position = html.rfind(
                  "</body>"
              )

              html = (
                  html[:position]
                  + link
                  + "\n"
                  + html[position:]
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print("Akses internal APK siap.")
          PY


      # ======================================================
      # 10. SALIN LOGO SPLASH
      # ======================================================

      - name: Copy HSM Splash Logo
        shell: bash
        run: |
          if [ ! -f hsm-logo.png ]; then
            echo "ERROR: hsm-logo.png tidak ditemukan."
            exit 1
          fi

          mkdir -p android-app/www

          cp \
            hsm-logo.png \
            android-app/www/hsm-logo.png

          echo "Logo splash siap."


      # ======================================================
      # 11. SPLASH SCREEN 3 DETIK
      # ======================================================

      - name: Add HSM Splash Screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android-app/www/index.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          marker = "hsm-custom-splash"

          if marker not in html:

              splash = """
          <!-- HSM CUSTOM SPLASH SCREEN -->

          <style>

            #hsm-custom-splash {
              position: fixed;
              inset: 0;
              z-index: 2147483647;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              background: #ffffff;
              padding: 24px;
              text-align: center;
              opacity: 1;
              transition: opacity .4s ease;
            }

            #hsm-custom-splash.hsm-hide {
              opacity: 0;
              pointer-events: none;
            }

            #hsm-custom-splash .hsm-splash-logo {
              width: min(55vw,230px);
              max-height: 230px;
              object-fit: contain;
              margin-bottom: 35px;
              animation: hsmFadeIn .9s ease both;
            }

            #hsm-custom-splash .hsm-splash-welcome {
              color: #0754a6;
              font-family: Arial,sans-serif;
              font-size: 22px;
              font-weight: 800;
              letter-spacing: 1px;
              margin-bottom: 12px;
              animation: hsmFadeIn 1.1s ease both;
            }

            #hsm-custom-splash .hsm-splash-tagline {
              color: #64748b;
              font-family: Arial,sans-serif;
              font-size: 14px;
              line-height: 1.6;
              animation: hsmFadeIn 1.3s ease both;
            }

            #hsm-custom-splash .hsm-splash-company {
              position: absolute;
              bottom: 45px;
              left: 15px;
              right: 15px;
              color: #0754a6;
              font-family: Arial,sans-serif;
              font-size: 11px;
              font-weight: 700;
              letter-spacing: 1px;
              animation: hsmFadeIn 1.5s ease both;
            }

            @keyframes hsmFadeIn {

              from {
                opacity: 0;
                transform: translateY(15px);
              }

              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

          </style>

          <div id="hsm-custom-splash">

            <img
              class="hsm-splash-logo"
              src="hsm-logo.png"
              alt="HSM Transport"
            >

            <div class="hsm-splash-welcome">
              SELAMAT DATANG
            </div>

            <div class="hsm-splash-tagline">
              Perjalanan Nyaman, Pilihan Tepat.
            </div>

            <div class="hsm-splash-company">
              PT HIDAYAH SARANA MULIA
            </div>

          </div>

          <script>

            (function () {

              function closeSplash() {

                var splash =
                  document.getElementById(
                    "hsm-custom-splash"
                  );

                if (!splash) return;

                setTimeout(function () {

                  splash.classList.add(
                    "hsm-hide"
                  );

                  setTimeout(function () {

                    splash.remove();

                  }, 450);

                }, 3000);
              }

              if (
                document.readyState ===
                "loading"
              ) {

                document.addEventListener(
                  "DOMContentLoaded",
                  closeSplash,
                  { once:true }
                );

              } else {

                closeSplash();

              }

            })();

          </script>

          <!-- END HSM CUSTOM SPLASH SCREEN -->
          """

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag body tidak ditemukan."
                  )

              position = html.rfind(
                  "</body>"
              )

              html = (
                  html[:position]
                  + splash
                  + "\n"
                  + html[position:]
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print("Splash Screen HSM siap.")
          PY


      # ======================================================
      # 12. SIAPKAN BRIDGE AUDIO DI PETUGAS.HTML
      #
      # PERUBAHAN HANYA PADA SALINAN APK.
      # FILE ASLI WEBSITE TIDAK DIUBAH.
      #
      # Fungsi playQRBeep() dari petugas.html
      # akan menggunakan Android Native jika tersedia.
      #
      # Jika tidak tersedia, tetap gunakan audio HTML.
      # ======================================================

      - name: Enable Native QR Feedback in APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android-app/www/petugas.html"
          )

          html = path.read_text(
              encoding="utf-8"
          )

          marker = "hsm-native-qr-feedback"

          if marker not in html:

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag body petugas.html tidak ditemukan."
                  )

              script = """
          <!-- hsm-native-qr-feedback -->

          <script>

          (function () {

            "use strict";

            /*
              Bridge Android Native HSM.

              Check-in berhasil:
              1 bunyi + 1 getaran.

              Check-in gagal:
              3 bunyi + 3 getaran.

              Kode petugas.html asli tetap digunakan
              untuk semua fitur lainnya.
            */

            var originalFeedback =
              window.playQRBeep;

            window.playQRBeep =
              function (success) {

                var accepted =
                  success !== false;

                try {

                  if (
                    window.HSMNative &&
                    typeof window.HSMNative.feedback ===
                      "function"
                  ) {

                    window.HSMNative.feedback(
                      accepted
                    );

                    return Promise.resolve(true);
                  }

                } catch (error) {

                  console.warn(
                    "HSM native feedback:",
                    error
                  );
                }

                if (
                  typeof originalFeedback ===
                  "function"
                ) {

                  return originalFeedback(
                    accepted
                  );
                }

                return Promise.resolve(false);
              };

            console.log(
              "HSM Native QR Feedback siap."
            );

          })();

          </script>
          """

              position = html.rfind(
                  "</body>"
              )

              html = (
                  html[:position]
                  + script
                  + "\n"
                  + html[position:]
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print(
              "Bridge QR Native siap di petugas.html."
          )
          PY


      # ======================================================
      # 13. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor
        working-directory: android-app
        shell: bash
        run: |
          npm install --no-audit --no-fund


      # ======================================================
      # 14. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android Project
        working-directory: android-app
        shell: bash
        run: |
          npx cap add android


      # ======================================================
      # 15. KONFIGURASI ANDROID MAINACTIVITY
      #
      # FITUR:
      # - Tombol Back Android
      # - Audio Scanner Native
      # - Getaran Scanner Native
      #
      # Audio menggunakan ToneGenerator Android.
      # Volume mengikuti volume MEDIA perangkat.
      #
      # Tidak membutuhkan file audio eksternal.
      # ======================================================

      - name: Configure Android Native Features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_root = Path(
              "android-app/android/app/src/main/java"
          )

          files = list(
              java_root.rglob(
                  "MainActivity.java"
              )
          )

          if len(files) != 1:
              raise RuntimeError(
                  "MainActivity.java tidak ditemukan "
                  "atau ditemukan lebih dari satu."
              )

          path = files[0]

          original = path.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not match:
              raise RuntimeError(
                  "Package Android tidak ditemukan."
              )

          package = match.group(1)

          code = """
          package PACKAGE_NAME;

          import android.content.Context;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPressed = 0;

              private final Handler feedbackHandler =
                  new Handler(Looper.getMainLooper());

              private final class HSMNativeBridge {

                  @JavascriptInterface
                  public void feedback(boolean success) {

                      runOnUiThread(() -> {

                          WebView webView =
                              getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView == null) {
                              return;
                          }

                          String url = webView.getUrl();

                          if (url == null) {
                              return;
                          }

                          // Batasi bridge untuk halaman
                          // petugas lokal milik APK.
                          Uri uri = Uri.parse(url);

                          if (
                              !"https".equals(uri.getScheme()) ||
                              !"localhost".equals(uri.getHost()) ||
                              !"/petugas.html".equals(uri.getPath())
                          ) {
                              return;
                          }

                          playNativeFeedback(success);

                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (webView != null) {

                      webView.addJavascriptInterface(
                          new HSMNativeBridge(),
                          "HSMNative"
                      );
                  }

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {

                          @Override
                          public void handleOnBackPressed() {

                              WebView webView =
                                  getBridge().getWebView();

                              if (webView == null) {
                                  finish();
                                  return;
                              }

                              String url =
                                  webView.getUrl();

                              String path = "";

                              if (url != null) {

                                  String parsedPath =
                                      Uri.parse(url).getPath();

                                  if (parsedPath != null) {
                                      path = parsedPath;
                                  }
                              }

                              path = path.toLowerCase(
                                  java.util.Locale.ROOT
                              );

                              boolean isHome =
                                  path.isEmpty() ||
                                  path.equals("/") ||
                                  path.endsWith("/index.html");

                              boolean isPortal =
                                  path.endsWith("/portal.html");

                              boolean isStaff =
                                  path.endsWith("/petugas.html");

                              boolean isAdmin =
                                  path.endsWith("/admin.html");

                              if (isStaff || isAdmin) {

                                  webView.loadUrl(
                                      "https://localhost/portal.html"
                                  );

                                  return;
                              }

                              if (isPortal) {

                                  webView.loadUrl(
                                      "https://localhost/index.html"
                                  );

                                  return;
                              }

                              if (!isHome) {

                                  webView.loadUrl(
                                      "https://localhost/index.html"
                                  );

                                  return;
                              }

                              long now =
                                  System.currentTimeMillis();

                              if (
                                  now - lastBackPressed < 2000
                              ) {

                                  finish();

                              } else {

                                  lastBackPressed = now;

                                  Toast.makeText(
                                      MainActivity.this,
                                      "Tekan sekali lagi untuk keluar dari HSM Transport",
                                      Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                      }
                  );
              }

              // =================================================
              // SUARA DAN GETARAN NATIVE
              // =================================================

              private void playNativeFeedback(
                  boolean success
              ) {

                  playNativeVibration(success);

                  playNativeSound(success);
              }

              // =================================================
              // GETARAN
              // =================================================

              private void playNativeVibration(
                  boolean success
              ) {

                  try {

                      Vibrator vibrator =
                          (Vibrator) getSystemService(
                              Context.VIBRATOR_SERVICE
                          );

                      if (
                          vibrator == null ||
                          !vibrator.hasVibrator()
                      ) {
                          return;
                      }

                      long[] pattern = success
                          ? new long[]{0, 200}
                          : new long[]{0, 95, 85, 95, 85, 95};

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          vibrator.vibrate(
                              VibrationEffect.createWaveform(
                                  pattern,
                                  -1
                              )
                          );

                      } else {

                          vibrator.vibrate(
                              pattern,
                              -1
                          );
                      }

                  } catch (Exception error) {

                      android.util.Log.w(
                          "HSM",
                          "Getaran gagal",
                          error
                      );
                  }
              }

              // =================================================
              // AUDIO NATIVE
              // =================================================

              private void playNativeSound(
                  boolean success
              ) {

                  try {

                      final ToneGenerator tone =
                          new ToneGenerator(
                              AudioManager.STREAM_MUSIC,
                              100
                          );

                      if (success) {

                          tone.startTone(
                              ToneGenerator.TONE_PROP_BEEP,
                              260
                          );

                          feedbackHandler.postDelayed(
                              tone::release,
                              450
                          );

                      } else {

                          for (int i = 0; i < 3; i++) {

                              long delay = i * 175L;

                              feedbackHandler.postDelayed(
                                  () -> tone.startTone(
                                      ToneGenerator.TONE_PROP_NACK,
                                      100
                                  ),
                                  delay
                              );
                          }

                          feedbackHandler.postDelayed(
                              tone::release,
                              750
                          );
                      }

                  } catch (Exception error) {

                      android.util.Log.w(
                          "HSM",
                          "Suara scanner gagal",
                          error
                      );
                  }
              }
          }
          """

          code = code.replace(
              "PACKAGE_NAME",
              package
          )

          path.write_text(
              code.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "MainActivity dengan Audio Native, "
              "Getaran Native dan tombol Back siap."
          )
          PY


      # ======================================================
      # 16. IZIN KAMERA DAN GETARAN ANDROID
      #
      # CAMERA:
      # Untuk membaca QR Code.
      #
      # VIBRATE:
      # Untuk getaran berhasil dan gagal.
      #
      # Kamera tidak wajib agar APK
      # tetap bisa dipasang pada perangkat lain.
      # ======================================================

      - name: Enable HSM Android Permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "android-app/android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise RuntimeError(
                  "AndroidManifest.xml tidak ditemukan."
              )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              (
                  "android.permission.CAMERA",
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  "android.permission.VIBRATE",
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              )
          ]

          for permission_name, xml in permissions:

              if permission_name not in content:

                  if "<application" not in content:
                      raise RuntimeError(
                          "Tag application tidak ditemukan."
                      )

                  content = content.replace(
                      "<application",
                      "    " + xml +
                      "\n\n    <application",
                      1
                  )

          camera_feature = (
              '<uses-feature '
              'android:name="android.hardware.camera" '
              'android:required="false" />'
          )

          if (
              "android.hardware.camera"
              not in content
          ):

              content = content.replace(
                  "<application",
                  "    " + camera_feature +
                  "\n\n    <application",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          for name in [
              "android.permission.CAMERA",
              "android.permission.VIBRATE"
          ]:
              if name not in content:
                  raise RuntimeError(
                      "Izin gagal dipasang: " + name
                  )

          print(
              "Izin CAMERA dan VIBRATE berhasil dipasang."
          )
          PY


      # ======================================================
      # 17. GENERATE IKON RESMI HSM
      # ======================================================

      - name: Generate HSM Transport App Icon
        working-directory: android-app
        shell: bash
        run: |
          echo "Memeriksa ikon HSM..."

          if [ ! -f ../hsm-apk-icon.png ]; then
            echo "ERROR: hsm-apk-icon.png tidak ditemukan!"
            exit 1
          fi

          mkdir -p assets

          cp \
            ../hsm-apk-icon.png \
            assets/icon.png

          echo "Memasang generator ikon..."

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            @capacitor/assets

          echo "Generate ikon Android..."

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

          echo "Ikon HSM berhasil dibuat."


      # ======================================================
      # 18. SINKRONISASI ANDROID
      # ======================================================

      - name: Sync Android
        working-directory: android-app
        shell: bash
        run: |
          npx cap sync android


      # ======================================================
      # 19. BUILD APK
      # ======================================================

      - name: Build APK
        working-directory: android-app/android
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # ======================================================
      # 20. UBAH NAMA APK
      # ======================================================

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          echo "APK HSM Transport berhasil dibuat."

          ls -lh output/


      # ======================================================
      # 21. UPLOAD APK KE GITHUB ACTIONS
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error
