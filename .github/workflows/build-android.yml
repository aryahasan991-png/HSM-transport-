# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD APK ANDROID - CAPACITOR
#
# FITUR:
# 01. Setup Node.js 22
# 02. Setup Java 21
# 03. Setup Android SDK
# 04. Terima lisensi Android SDK
# 05. Install Android Platform
# 06. Salin website HSM
# 07. Buat portal internal APK
# 08. Tambahkan akses internal APK
# 09. Install Capacitor
# 10. Generate Android Project
# 11. Generate ikon resmi HSM Transport
# 12. Sinkronisasi Android
# 13. Build APK
# 14. Ubah nama APK
# 15. Upload APK ke GitHub Actions
#
# IKON:
# hsm-apk-icon.png
#
# WEBSITE VERCEL TIDAK DIUBAH
#
# OUTPUT:
# HSM-Transport.apk
#
# VERSI DEBUG UNTUK PENGUJIAN
# ============================================================

name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. SETUP NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ======================================================
      # 3. SETUP JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # ======================================================
      # 4. SETUP ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "false"
          packages: ""


      # ======================================================
      # 5. TERIMA LISENSI ANDROID SDK
      # ======================================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail

          yes | sdkmanager --licenses > /dev/null

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "Gagal menerima lisensi Android SDK."
            exit "$result"
          fi

          echo "Lisensi Android SDK berhasil diproses."


      # ======================================================
      # 6. INSTALL ANDROID PLATFORM
      # ======================================================

      - name: Install Android Platform
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"


      # ======================================================
      # 7. PERSIAPKAN WEBSITE HSM
      #
      # Semua file website disalin ke folder www.
      # File website asli tidak dimodifikasi.
      # ======================================================

      - name: Prepare HSM Website
        shell: bash
        run: |
          mkdir -p android-app/www

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json
          do
            if [ -f "$file" ]; then
              cp "$file" android-app/www/
            fi
          done

          echo "Memeriksa file website HSM..."

          test -f android-app/www/index.html
          test -f android-app/www/admin.html
          test -f android-app/www/petugas.html
          test -f android-app/www/config.js
          test -f android-app/www/app.js

          echo "Website HSM siap."


      # ======================================================
      # 8. PORTAL INTERNAL KHUSUS APK
      #
      # Berisi akses admin dan petugas.
      # Tidak mengubah website Vercel.
      # ======================================================

      - name: Prepare APK Internal Portal
        shell: bash
        run: |
          if [ ! -f android-app/www/portal.html ]; then

            cat > android-app/www/portal.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1"
            >

            <meta
              name="theme-color"
              content="#0754a6"
            >

            <title>
              Portal Internal HSM Transport
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                padding: 20px;
                min-height: 100vh;
                font-family: Arial, sans-serif;
                background: #f4f7fb;
                display: flex;
                align-items: center;
                justify-content: center;
              }

              .card {
                width: 100%;
                max-width: 440px;
                padding: 28px 22px;
                background: white;
                border-radius: 18px;
                text-align: center;
                box-shadow:
                  0 8px 28px rgba(0,0,0,.08);
              }

              h1 {
                color: #0754a6;
                font-size: 24px;
              }

              p {
                color: #64748b;
                line-height: 1.7;
              }

              a {
                display: block;
                margin-top: 14px;
                padding: 15px;
                border-radius: 11px;
                background: #0754a6;
                color: white;
                font-weight: bold;
                text-decoration: none;
              }

              a.secondary {
                background: #e2e8f0;
                color: #334155;
              }

            </style>

          </head>

          <body>

            <main class="card">

              <h1>
                HSM Transport
              </h1>

              <p>
                Portal Internal
                <br>
                PT Hidayah Sarana Mulia
              </p>

              <a href="admin.html">
                🔐 Dashboard Admin
              </a>

              <a href="petugas.html">
                🚐 Portal Sopir & Kernet
              </a>

              <a
                href="index.html"
                class="secondary"
              >
                Kembali ke Penumpang
              </a>

            </main>

          </body>

          </html>
          HTML

          fi

          echo "Portal internal APK siap."


      # ======================================================
      # 9. TAMBAHKAN AKSES INTERNAL DI APK
      #
      # Website Vercel tetap tidak berubah.
      # ======================================================

      - name: Add APK Internal Access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android-app/www/index.html")

          html = path.read_text(
              encoding="utf-8"
          )

          marker = "hsm-apk-internal-access"

          if marker not in html:

              link = '''
          <div
            id="hsm-apk-internal-access"
            style="
              text-align:center;
              padding:16px;
              background:#f5f7fa;
            "
          >
            <a
              href="portal.html"
              style="
                color:#64748b;
                font-size:12px;
                text-decoration:none;
              "
            >
              🔐 Akses Internal HSM
            </a>
          </div>
          '''

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag penutup body tidak ditemukan."
                  )

              html = html.replace(
                  "</body>",
                  link + "\n</body>",
                  1
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print("Akses internal APK siap.")
          PY


      # ======================================================
      # 10. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor
        working-directory: android-app
        shell: bash
        run: |
          npm install --no-audit --no-fund


      # ======================================================
      # 11. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android Project
        working-directory: android-app
        shell: bash
        run: |
          npx cap add android


      # ======================================================
      # 12. GENERATE IKON RESMI HSM TRANSPORT
      #
      # PERUBAHAN BARU:
      #
      # Sumber gambar:
      # hsm-apk-icon.png
      #
      # Background putih.
      # Mengganti ikon bawaan Capacitor.
      # ======================================================

      - name: Generate HSM Transport App Icon
        working-directory: android-app
        shell: bash
        run: |

          echo "Memeriksa gambar ikon HSM..."

          if [ ! -f ../hsm-apk-icon.png ]; then
            echo "ERROR: hsm-apk-icon.png tidak ditemukan!"
            echo "Upload gambar ke root repository GitHub."
            exit 1
          fi

          echo "Menyiapkan folder ikon..."

          mkdir -p assets

          cp ../hsm-apk-icon.png assets/icon.png

          echo "Memasang generator ikon Capacitor..."

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            @capacitor/assets

          echo "Membuat ikon Android..."

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

          echo "Ikon resmi HSM Transport berhasil dibuat."


      # ======================================================
      # 13. SINKRONISASI ANDROID
      # ======================================================

      - name: Sync Android
        working-directory: android-app
        shell: bash
        run: |
          npx cap sync android


      # ======================================================
      # 14. BUILD APK
      # ======================================================

      - name: Build APK
        working-directory: android-app/android
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # ======================================================
      # 15. UBAH NAMA APK
      # ======================================================

      - name: Rename APK
        shell: bash
        run: |

          mkdir -p output

          cp \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          echo "APK HSM Transport berhasil dibuat."

          ls -lh output/


      # ======================================================
      # 16. UPLOAD APK KE GITHUB ACTIONS
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error
