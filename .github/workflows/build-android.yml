# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD 2 APK ANDROID
#
# 1. HSM Transport
#    com.hsmtransport.app
#    Khusus penumpang
#
# 2. HSM Internal
#    com.hsmtransport.internal
#    Admin + Sopir & Kernet
#
# Capacitor 8
# ============================================================

name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 2 Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ======================================================
      # 3. JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "true"
          packages: ""

      - name: Install Android Platform
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ======================================================
      # 5. VALIDASI
      # ======================================================

      - name: Validate HSM Files
        shell: bash
        run: |
          set -e

                    for file in \
            index.html \
            admin.html \
            petugas.html \
            config.js \
            app.js \
            hsm-logo.png \
            hsm-apk-icon.png \
            hsm-petugas-premium.js \
            hsm-pwa-audio.js \
            hsm_scan_success.wav \
            hsm_scan_error.wav \
            android-app/package.json
          do

            if [ ! -s "$file" ]; then
              echo "File tidak ditemukan: $file"
              exit 1
            fi

          done

          echo "Semua file utama tersedia."

      # ======================================================
      # 6. MEMBUAT DUA PROJECT CAPACITOR
      # ======================================================

      - name: Prepare Two Capacitor Projects
        shell: bash
        run: |
          set -e

          mkdir -p builds/passenger/www
          mkdir -p builds/internal/www

          cp android-app/package.json \
            builds/passenger/package.json

          cp android-app/package.json \
            builds/internal/package.json

          # Salin file website ke masing-masing project.
          # Hanya mengambil file pada folder utama repository.

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json \
            ./*.webmanifest \
            ./*.wav
          do

            if [ -f "$file" ]; then
              cp "$file" builds/passenger/www/
              cp "$file" builds/internal/www/
            fi

          done

          # APK Penumpang:
          # Hilangkan halaman dan skrip internal.

          rm -f builds/passenger/www/admin.html
          rm -f builds/passenger/www/petugas.html
          rm -f builds/passenger/www/portal.html

          rm -f builds/passenger/www/admin.js
          rm -f builds/passenger/www/hsm-admin-extra.js

          # Menu PWA khusus iPhone tidak diperlukan
          # dalam APK Android penumpang.

          rm -f builds/passenger/www/hsm-pwa-menu.js

          # Konfigurasi masing-masing aplikasi.

          python3 - <<'PY'
          import json
          from pathlib import Path

          configs = {
              "passenger": {
                  "appId": "com.hsmtransport.app",
                  "appName": "HSM Transport",
                  "webDir": "www",
                  "android": {
                      "backgroundColor": "#ffffff"
                  }
              },
              "internal": {
                  "appId": "com.hsmtransport.internal",
                  "appName": "HSM Internal",
                  "webDir": "www",
                  "android": {
                      "backgroundColor": "#ffffff"
                  }
              }
          }

          for name, config in configs.items():
              path = Path(
                  f"builds/{name}/capacitor.config.json"
              )

              path.write_text(
                  json.dumps(
                      config,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          print("Dua konfigurasi Capacitor siap.")
          PY

      # ======================================================
      # 7. HALAMAN UTAMA HSM INTERNAL
      # ======================================================

      - name: Create HSM Internal Home
        shell: bash
        run: |
          set -e

          cat > builds/internal/www/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <meta
              name="theme-color"
              content="#0754a6"
            >

            <meta
              name="robots"
              content="noindex,nofollow"
            >

            <title>
              HSM Internal
            </title>

            <style>

              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                min-height: 100vh;
                padding: 25px 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f2f6fc;
                font-family: Arial, sans-serif;
              }

              .card {
                width: 100%;
                max-width: 440px;
                background: white;
                border-radius: 20px;
                padding: 34px 23px;
                text-align: center;
                box-shadow:
                  0 10px 35px rgba(7,84,166,.09);
                border: 1px solid #dce5f0;
              }

              .logo {
                display: block;
                width: 180px;
                max-width: 75%;
                margin: 0 auto 22px;
              }

              h1 {
                margin: 0;
                font-size: 25px;
                color: #0754a6;
              }

              .company {
                margin: 9px 0 27px;
                font-size: 12px;
                color: #64748b;
                line-height: 1.6;
              }

              .menu {
                display: block;
                padding: 19px 15px;
                margin-top: 14px;
                text-decoration: none;
                background: #0754a6;
                color: white;
                border-radius: 13px;
                font-weight: bold;
                font-size: 15px;
              }

              .menu.petugas {
                background: #063d79;
              }

              .menu span {
                display: block;
                margin-top: 7px;
                font-size: 11px;
                font-weight: normal;
                opacity: .9;
              }

              .footer {
                margin-top: 29px;
                font-size: 11px;
                color: #94a3b8;
              }

            </style>

          </head>

          <body>

            <main class="card">

              <img
                src="hsm-logo.png"
                class="logo"
                alt="HSM Transport"
              >

              <h1>HSM Internal</h1>

              <div class="company">
                Portal Resmi Perusahaan<br>
                PT Hidayah Sarana Mulia
              </div>

              <a
                class="menu"
                href="admin.html"
              >
                🔐 Login Admin

                <span>
                  Dashboard pengelolaan HSM Transport
                </span>
              </a>

              <a
                class="menu petugas"
                href="petugas.html"
              >
                🚐 Login Sopir & Kernet

                <span>
                  Manifest, perjalanan, dan QR Scanner
                </span>
              </a>

              <div class="footer">
                KHUSUS INTERNAL HSM TRANSPORT
              </div>

            </main>

          </body>

          </html>
          HTML

      # ======================================================
      # 8. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor Dependencies
        shell: bash
        run: |
          set -e

          for app in passenger internal
          do

            echo "Install Capacitor: $app"

            (
              cd "builds/$app"

              npm install \
                --no-audit \
                --no-fund
            )

          done

      # ======================================================
      # 9. GENERATE ANDROID PROJECTS
      # ======================================================

      - name: Generate Android Projects
        shell: bash
        run: |
          set -e

          for app in passenger internal
          do

            echo "Generate Android: $app"

            (
              cd "builds/$app"

              npx cap add android
            )

          done

      # ======================================================
      # 10. IKON KEDUA APLIKASI
      # ======================================================

      - name: Generate HSM App Icons
        shell: bash
        run: |
          set -e

          for app in passenger internal
          do

            (
              cd "builds/$app"

              mkdir -p assets

              cp ../../hsm-apk-icon.png \
                assets/icon.png

              npm install \
                --no-save \
                --no-audit \
                --no-fund \
                @capacitor/assets

              npx capacitor-assets generate \
                --android \
                --iconBackgroundColor '#ffffff' \
                --iconBackgroundColorDark '#ffffff'
            )

          done

      # ======================================================
      # 11. INSTALL AUDIO HSM INTERNAL
      # ======================================================

      - name: Install HSM Internal Scanner Sounds
        shell: bash
        run: |
          set -e

          RAW_DIR="builds/internal/android/app/src/main/res/raw"

          mkdir -p "$RAW_DIR"

          cp hsm_scan_success.wav \
            "$RAW_DIR/hsm_scan_success.wav"

          cp hsm_scan_error.wav \
            "$RAW_DIR/hsm_scan_error.wav"

          echo "Kedua suara scanner terpasang."

      # ======================================================
      # 12. NATIVE AUDIO + GETARAN INTERNAL
      # ======================================================

      - name: Configure HSM Internal Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "builds/internal/android/app/src/main/java"
          )

          files = list(
              root.rglob("MainActivity.java")
          )

          if len(files) != 1:
              raise RuntimeError(
                  "MainActivity.java tidak ditemukan."
              )

          path = files[0]

          original = path.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not match:
              raise RuntimeError(
                  "Package Java tidak ditemukan."
              )

          package_name = match.group(1)

          code = r"""
          package PACKAGE_NAME;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPressed = 0;

              private SoundPool soundPool;

              private int successSound;
              private int errorSound;

              private boolean successReady = false;
              private boolean errorReady = false;

              private int successStream = 0;
              private int errorStream = 0;

              // ============================================
              // JAVASCRIPT BRIDGE
              // ============================================

              private final class HSMNativeBridge {

                  @JavascriptInterface
                  public void feedback(boolean success) {

                      runOnUiThread(() -> {

                          WebView webView =
                              getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView == null) {
                              return;
                          }

                          String url = webView.getUrl();

                          if (url == null) {
                              return;
                          }

                          Uri uri = Uri.parse(url);

                          boolean allowed =
                              "https".equals(uri.getScheme()) &&
                              "localhost".equals(uri.getHost()) &&
                              "/petugas.html".equals(uri.getPath());

                          if (!allowed) {
                              return;
                          }

                          playFeedback(success);

                      });

                  }

              }

              // ============================================
              // ON CREATE
              // ============================================

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  initializeSounds();

                  WebView webView =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (webView != null) {

                      webView.addJavascriptInterface(
                          new HSMNativeBridge(),
                          "HSMNative"
                      );

                  }

                  configureBackButton();

              }

              // ============================================
              // LOAD CUSTOM WAV
              // ============================================

              private void initializeSounds() {

                  AudioAttributes attributes =
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA
                          )
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SONIFICATION
                          )
                          .build();

                  soundPool =
                      new SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(attributes)
                          .build();

                  soundPool.setOnLoadCompleteListener(
                      (pool, sampleId, status) -> {

                          if (status == 0) {

                              if (sampleId == successSound) {
                                  successReady = true;
                              }

                              if (sampleId == errorSound) {
                                  errorReady = true;
                              }

                          }

                      }
                  );

                  successSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_success,
                      1
                  );

                  errorSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_error,
                      1
                  );

              }

              // ============================================
              // FEEDBACK
              // ============================================

              private void playFeedback(boolean success) {

                  playVibration(success);
                  playSound(success);

              }

              private void playSound(boolean success) {

                  if (soundPool == null) {
                      return;
                  }

                  try {

                      if (success) {

                          if (!successReady) {
                              return;
                          }

                          if (successStream != 0) {
                              soundPool.stop(successStream);
                          }

                          successStream = soundPool.play(
                              successSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      } else {

                          if (!errorReady) {
                              return;
                          }

                          if (errorStream != 0) {
                              soundPool.stop(errorStream);
                          }

                          errorStream = soundPool.play(
                              errorSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner audio error",
                          error
                      );

                  }

              }

              // ============================================
              // VIBRATION
              // ============================================

              private void playVibration(boolean success) {

                  try {

                      Vibrator vibrator =
                          (Vibrator) getSystemService(
                              Context.VIBRATOR_SERVICE
                          );

                      if (
                          vibrator == null ||
                          !vibrator.hasVibrator()
                      ) {
                          return;
                      }

                      long[] pattern = success
                          ? new long[]{0,180}
                          : new long[]{0,100,70,100,70,100};

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          vibrator.vibrate(
                              VibrationEffect.createWaveform(
                                  pattern,
                                  -1
                              )
                          );

                      } else {

                          vibrator.vibrate(
                              pattern,
                              -1
                          );

                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner vibration error",
                          error
                      );

                  }

              }

              // ============================================
              // ANDROID BACK BUTTON
              // ============================================

              private void configureBackButton() {

                  getOnBackPressedDispatcher()
                      .addCallback(
                          this,
                          new OnBackPressedCallback(true) {

                              @Override
                              public void handleOnBackPressed() {

                                  WebView webView =
                                      getBridge() == null
                                          ? null
                                          : getBridge().getWebView();

                                  if (webView == null) {
                                      finish();
                                      return;
                                  }

                                  String url = webView.getUrl();
                                  String path = "";

                                  if (url != null) {

                                      String parsed =
                                          Uri.parse(url).getPath();

                                      if (parsed != null) {
                                          path = parsed;
                                      }

                                  }

                                  path = path.toLowerCase(
                                      java.util.Locale.ROOT
                                  );

                                  boolean home =
                                      path.isEmpty() ||
                                      path.equals("/") ||
                                      path.endsWith("/index.html");

                                  boolean staff =
                                      path.endsWith("/petugas.html");

                                  boolean admin =
                                      path.endsWith("/admin.html");

                                  if (staff || admin || !home) {

                                      webView.loadUrl(
                                          "https://localhost/index.html"
                                      );

                                      return;
                                  }

                                  long now =
                                      System.currentTimeMillis();

                                  if (
                                      now - lastBackPressed < 2000
                                  ) {

                                      finish();

                                  } else {

                                      lastBackPressed = now;

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Tekan sekali lagi untuk keluar",
                                          Toast.LENGTH_SHORT
                                      ).show();

                                  }

                              }

                          }
                      );

              }

              // ============================================
              // CLEANUP
              // ============================================

              @Override
              public void onDestroy() {

                  if (soundPool != null) {

                      soundPool.release();

                      soundPool = null;

                  }

                  super.onDestroy();

              }

          }
          """

          code = code.replace(
              "PACKAGE_NAME",
              package_name
          )

          path.write_text(
              code.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "HSM Internal Native Android siap."
          )
          PY

      # ======================================================
      # 13. IZIN KAMERA DAN GETARAN
      # ======================================================

      - name: Enable HSM Internal Permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "builds/internal/android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.CAMERA",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:

              if permission not in content:

                  line = (
                      '<uses-permission '
                      'android:name="' +
                      permission +
                      '" />'
                  )

                  content = content.replace(
                      "<application",
                      "    " + line +
                      "\n    <application",
                      1
                  )

          if "android.hardware.camera" not in content:

              content = content.replace(
                  "<application",
                  '    <uses-feature '
                  'android:name="android.hardware.camera" '
                  'android:required="false" />'
                  "\n    <application",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          print("Izin kamera dan getaran siap.")
          PY

      # ======================================================
      # 14. CAPACITOR SYNC
      # ======================================================

      - name: Sync Both Android Projects
        shell: bash
        run: |
          set -e

          for app in passenger internal
          do

            (
              cd "builds/$app"

              npx cap sync android
            )

          done

      # ======================================================
      # 15. BUILD APK PENUMPANG
      # ======================================================

      - name: Build HSM Transport APK
        shell: bash
        run: |
          set -e

          cd builds/passenger/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 16. BUILD APK INTERNAL
      # ======================================================

      - name: Build HSM Internal APK
        shell: bash
        run: |
          set -e

          cd builds/internal/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 17. PREPARE OUTPUT
      # ======================================================

      - name: Prepare Two APK Files
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            builds/passenger/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          cp \
            builds/internal/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Internal.apk

          echo "Kedua APK berhasil dibuat."

          ls -lh output/

      # ======================================================
      # 18. UPLOAD APK
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload HSM Internal APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Internal-APK
          path: output/HSM-Internal.apk
          retention-days: 30
          if-no-files-found: error
