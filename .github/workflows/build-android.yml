# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD 3 APK ANDROID
#
# 1. HSM Transport
#    com.hsmtransport.app
#    Aplikasi penumpang
#
# 2. HSM Internal
#    com.hsmtransport.internal
#    Admin, Sopir, Kernet
#    Scanner QR + GPS Live Tracking
#
# 3. HSM Owner
#    com.hsmtransport.owner
#    Dashboard pemilik perusahaan
#
# CAPACITOR 8
# ============================================================

name: Build 3 APK HSM

on:
  workflow_dispatch:

jobs:

  build:

    name: Build 3 Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. SETUP NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "22"

      # ======================================================
      # 3. SETUP JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "21"

      # ======================================================
      # 4. SETUP ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "true"
          packages: ""

      - name: Install Android Platform

        shell: bash

        run: |
          set -e

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ======================================================
      # 5. VALIDASI FILE HSM
      # ======================================================

      - name: Validate HSM Files

        shell: bash

        run: |
          set -e

          echo "Memeriksa file HSM Transport..."

          for file in \
            index.html \
            admin.html \
            petugas.html \
            config.js \
            app.js \
            hsm-logo.png \
            hsm-apk-icon.png \
            hsm-petugas-premium.js \
            hsm-pwa-audio.js \
            hsm_scan_success.wav \
            hsm_scan_error.wav \
            hsm-gps-tracking.js \
            hsm-gps-android/MainActivity.java \
            hsm-gps-android/HSMGpsService.java \
            owner-app/index.html \
            owner-app/config.js \
            owner-app/hsm-owner-security-fix.js \
            android-app/package.json
          do

            if [ ! -s "$file" ]; then

              echo "ERROR: File tidak ditemukan: $file"

              exit 1

            fi

          done

          echo "Semua file utama tersedia."

      # ======================================================
      # 6. MEMBUAT TIGA PROJECT CAPACITOR
      # ======================================================

      - name: Prepare Three Capacitor Projects

        shell: bash

        run: |
          set -e

          echo "Menyiapkan tiga aplikasi HSM..."

          for app in passenger internal owner
          do

            mkdir -p "builds/$app/www"

            cp android-app/package.json \
              "builds/$app/package.json"

          done

          # --------------------------------------------------
          # SALIN FILE WEBSITE UTAMA
          # --------------------------------------------------

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json \
            ./*.webmanifest \
            ./*.wav
          do

            if [ -f "$file" ]; then

              for app in passenger internal owner
              do

                cp "$file" "builds/$app/www/"

              done

            fi

          done

          # --------------------------------------------------
          # SALIN FOLDER ASET TAMBAHAN
          # --------------------------------------------------

          for folder in assets images img fonts
          do

            if [ -d "$folder" ]; then

              for app in passenger internal owner
              do

                cp -R "$folder" \
                  "builds/$app/www/"

              done

            fi

          done

          # --------------------------------------------------
          # APK PENUMPANG
          #
          # Tidak menyertakan halaman khusus internal.
          # --------------------------------------------------

          rm -f \
            builds/passenger/www/admin.html \
            builds/passenger/www/petugas.html \
            builds/passenger/www/portal.html \
            builds/passenger/www/admin.js \
            builds/passenger/www/hsm-admin-extra.js \
            builds/passenger/www/hsm-manifest.js \
            builds/passenger/www/hsm-staff-admin.js \
            builds/passenger/www/hsm-trip-monitor.js \
            builds/passenger/www/hsm-trip-corrections.js \
            builds/passenger/www/hsm-site-admin.js \
            builds/passenger/www/hsm-petugas-premium.js \
            builds/passenger/www/hsm-gps-tracking.js

          # --------------------------------------------------
          # KONFIGURASI CAPACITOR
          # --------------------------------------------------

          python3 - <<'PY'
          import json
          from pathlib import Path

          configs = {

              "passenger": {

                  "appId": "com.hsmtransport.app",

                  "appName": "HSM Transport",

                  "webDir": "www",

                  "android": {
                      "backgroundColor": "#ffffff"
                  }

              },

              "internal": {

                  "appId": "com.hsmtransport.internal",

                  "appName": "HSM Internal",

                  "webDir": "www",

                  "android": {
                      "backgroundColor": "#071e42"
                  }

              },

              "owner": {

                  "appId": "com.hsmtransport.owner",

                  "appName": "HSM Owner",

                  "webDir": "www",

                  "android": {
                      "backgroundColor": "#071e42"
                  }

              }

          }

          for name, config in configs.items():

              path = Path(
                  f"builds/{name}/capacitor.config.json"
              )

              path.write_text(
                  json.dumps(
                      config,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          print("Tiga konfigurasi Capacitor siap.")
          PY

      # ======================================================
      # 7. HALAMAN UTAMA HSM INTERNAL
      # ======================================================

      - name: Create HSM Internal Home

        shell: bash

        run: |
          set -e

          cat > builds/internal/www/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <meta
              name="theme-color"
              content="#071e42"
            >

            <title>HSM Internal</title>

            <style>

              * {
                box-sizing:border-box;
              }

              body {
                margin:0;
                min-height:100dvh;
                display:grid;
                place-items:center;
                padding:20px;
                background:
                  linear-gradient(
                    150deg,
                    #061936,
                    #0b3975 45%,
                    #dfe8f2 45%
                  );
                font-family:
                  system-ui,
                  -apple-system,
                  sans-serif;
              }

              .card {
                width:100%;
                max-width:430px;
                padding:30px 22px;
                border-radius:22px;
                background:#eaf1f8;
                box-shadow:0 15px 45px #06193630;
                text-align:center;
              }

              .logo {
                display:block;
                width:170px;
                max-width:75%;
                margin:0 auto 20px;
              }

              h1 {
                margin:0;
                color:#071e42;
                font-size:25px;
              }

              .company {
                margin:10px 0 27px;
                color:#687e98;
                font-size:12px;
                line-height:1.7;
              }

              .menu {
                display:flex;
                align-items:center;
                gap:14px;
                margin-top:12px;
                padding:17px;
                border-radius:14px;
                background:
                  linear-gradient(
                    120deg,
                    #0754a6,
                    #0b2a55
                  );
                color:#fff;
                text-align:left;
                text-decoration:none;
              }

              .menu svg {
                width:28px;
                height:28px;
                flex-shrink:0;
                fill:none;
                stroke:currentColor;
                stroke-width:1.7;
                stroke-linecap:round;
                stroke-linejoin:round;
              }

              .menu strong {
                display:block;
                font-size:14px;
              }

              .menu small {
                display:block;
                margin-top:5px;
                opacity:.8;
                font-size:11px;
              }

              .footer {
                margin-top:26px;
                color:#687e98;
                font-size:10px;
              }

            </style>

          </head>

          <body>

            <main class="card">

              <img
                class="logo"
                src="hsm-logo.png"
                alt="HSM Transport"
              >

              <h1>HSM Internal</h1>

              <div class="company">
                PT HIDAYAH SARANA MULIA<br>
                INTERNAL CONTROL CENTER
              </div>

              <a
                class="menu"
                href="admin.html"
              >

                <svg viewBox="0 0 24 24">
                  <rect
                    x="4"
                    y="10"
                    width="16"
                    height="11"
                    rx="2"
                  />
                  <path
                    d="M8 10V7a4 4 0 0 1 8 0v3"
                  />
                </svg>

                <span>

                  <strong>Login Admin</strong>

                  <small>
                    Dashboard operasional HSM
                  </small>

                </span>

              </a>

              <a
                class="menu"
                href="petugas.html"
              >

                <svg viewBox="0 0 24 24">

                  <rect
                    x="3"
                    y="7"
                    width="18"
                    height="12"
                    rx="3"
                  />

                  <path d="M6 7V4h12v3"/>
                  <path d="M3 12h18"/>
                  <path d="M7 19v2m10-2v2"/>

                </svg>

                <span>

                  <strong>
                    Login Sopir & Kernet
                  </strong>

                  <small>
                    Scan QR, manifest & perjalanan
                  </small>

                </span>

              </a>

              <div class="footer">
                KHUSUS PERSONEL HSM TRANSPORT
              </div>

            </main>

          </body>

          </html>
          HTML

      # ======================================================
      # 8. SIAPKAN HSM OWNER
      # ======================================================

      - name: Prepare HSM Owner Home

        shell: bash

        run: |
          set -e

          echo "Menyiapkan HSM Owner..."

          cp -R owner-app/. builds/owner/www/

          if ! grep -q \
            "HSM_OWNER_CONFIG" \
            builds/owner/www/config.js
          then

            echo "ERROR: Konfigurasi Owner tidak ditemukan."

            exit 1

          fi

          echo "HSM Owner siap."

      # ======================================================
      # 9. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Capacitor Dependencies

        shell: bash

        run: |
          set -e

          for app in passenger internal owner
          do

            echo "Install Capacitor: $app"

            (
              cd "builds/$app"

              npm install \
                --no-audit \
                --no-fund
            )

          done

      # ======================================================
      # 10. GENERATE ANDROID PROJECTS
      # ======================================================

      - name: Generate Three Android Projects

        shell: bash

        run: |
          set -e

          for app in passenger internal owner
          do

            echo "Generate Android: $app"

            (
              cd "builds/$app"

              npx cap add android
            )

          done

      # ======================================================
      # 11. GENERATE IKON APLIKASI
      # ======================================================

      - name: Generate HSM App Icons

        shell: bash

        run: |
          set -e

          for app in passenger internal owner
          do

            (
              cd "builds/$app"

              mkdir -p assets

              cp ../../hsm-apk-icon.png \
                assets/icon.png

              npm install \
                --no-save \
                --no-audit \
                --no-fund \
                @capacitor/assets

              npx capacitor-assets generate \
                --android \
                --iconBackgroundColor '#ffffff' \
                --iconBackgroundColorDark '#ffffff'
            )

          done

      # ======================================================
      # 12. PASANG SUARA SCANNER HSM INTERNAL
      # ======================================================

      - name: Install HSM Internal Scanner Sounds

        shell: bash

        run: |
          set -e

          RAW_DIR="builds/internal/android/app/src/main/res/raw"

          mkdir -p "$RAW_DIR"

          cp \
            hsm_scan_success.wav \
            "$RAW_DIR/hsm_scan_success.wav"

          cp \
            hsm_scan_error.wav \
            "$RAW_DIR/hsm_scan_error.wav"

          echo "Audio scanner berhasil dipasang."

      # ======================================================
      # 13. INSTALL NATIVE ANDROID GPS
      #
      # HANYA UNTUK HSM INTERNAL
      #
      # MainActivity.java:
      # - Native scanner audio
      # - Native getaran
      # - Android GPS bridge
      # - Tombol kembali Android
      #
      # HSMGpsService.java:
      # - Foreground GPS
      # - Notifikasi lokasi
      # - Mengirim lokasi ke Supabase
      # - Berhenti ketika sesi berakhir
      # ======================================================

      - name: Install HSM Internal Native GPS

        shell: bash

        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          java_root = Path(
              "builds/internal/android/app/src/main/java"
          )

          matches = list(
              java_root.rglob("MainActivity.java")
          )

          if len(matches) != 1:

              raise RuntimeError(
                  "MainActivity.java tidak ditemukan."
              )

          main_activity = matches[0]

          original = main_activity.read_text(
              encoding="utf-8"
          )

          package_match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not package_match:

              raise RuntimeError(
                  "Package Android tidak ditemukan."
              )

          package_name = package_match.group(1)

          templates = [
              "MainActivity.java",
              "HSMGpsService.java"
          ]

          for filename in templates:

              source = Path(
                  "hsm-gps-android"
              ) / filename

              if not source.is_file():

                  raise RuntimeError(
                      f"File GPS tidak ditemukan: {source}"
                  )

              code = source.read_text(
                  encoding="utf-8"
              )

              code = code.replace(
                  "PACKAGE_NAME",
                  package_name
              )

              destination = (
                  main_activity.parent / filename
              )

              destination.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  f"Installed: {destination}"
              )

          print(
              "Native Android GPS HSM Internal siap."
          )
          PY

      # ======================================================
      # 14. IZIN GPS, KAMERA, GETARAN
      #
      # Android 13:
      # POST_NOTIFICATIONS
      #
      # Android 14+:
      # FOREGROUND_SERVICE_LOCATION
      #
      # GPS foreground service menampilkan
      # notifikasi selama pelacakan berlangsung.
      # ======================================================

      - name: Enable HSM Internal GPS Permissions

        shell: bash

        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "builds/internal/android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [

              "android.permission.CAMERA",

              "android.permission.VIBRATE",

              "android.permission.ACCESS_FINE_LOCATION",

              "android.permission.ACCESS_COARSE_LOCATION",

              "android.permission.POST_NOTIFICATIONS",

              "android.permission.FOREGROUND_SERVICE",

              "android.permission.FOREGROUND_SERVICE_LOCATION"

          ]

          for permission in permissions:

              if permission not in content:

                  declaration = (
                      '<uses-permission '
                      'android:name="' +
                      permission +
                      '" />'
                  )

                  content = content.replace(
                      "<application",
                      "    " + declaration +
                      "\n    <application",
                      1
                  )

          if "android.hardware.camera" not in content:

              content = content.replace(
                  "<application",
                  '    <uses-feature '
                  'android:name="android.hardware.camera" '
                  'android:required="false" />'
                  "\n    <application",
                  1
              )

          if "android.hardware.location.gps" not in content:

              content = content.replace(
                  "<application",
                  '    <uses-feature '
                  'android:name="android.hardware.location.gps" '
                  'android:required="false" />'
                  "\n    <application",
                  1
              )

          if 'android:name=".HSMGpsService"' not in content:

              service = (
                  '\n        <service '
                  'android:name=".HSMGpsService" '
                  'android:exported="false" '
                  'android:foregroundServiceType="location" '
                  'android:stopWithTask="false" />\n'
              )

              content = content.replace(
                  "</application>",
                  service + "    </application>",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          print(
              "Izin GPS Android berhasil dikonfigurasi."
          )
          PY

      # ======================================================
      # 15. PASANG KONTROL GPS PADA PORTAL PETUGAS
      #
      # hsm-gps-tracking.js
      # hanya dimasukkan ke APK Internal.
      #
      # File petugas.html asli tidak diubah
      # di repository.
      # ======================================================

      - name: Install GPS Control Into Staff Portal

        shell: bash

        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          html_file = Path(
              "builds/internal/www/petugas.html"
          )

          html = html_file.read_text(
              encoding="utf-8"
          )

          script_name = "hsm-gps-tracking.js"

          snippet = (
              '<script '
              'src="./hsm-gps-tracking.js?v=1">'
              '</script>'
          )

          if script_name not in html:

              if not re.search(
                  r"</body>",
                  html,
                  re.IGNORECASE
              ):

                  raise RuntimeError(
                      "Tag </body> tidak ditemukan."
                  )

              html = re.sub(
                  r"</body>",
                  lambda _: snippet + "\n</body>",
                  html,
                  count=1,
                  flags=re.IGNORECASE
              )

              html_file.write_text(
                  html,
                  encoding="utf-8"
              )

          print(
              "Kontrol GPS berhasil dipasang pada Portal Petugas."
          )
          PY

      # ======================================================
      # 16. CAPACITOR SYNC
      # ======================================================

      - name: Sync Three Android Projects

        shell: bash

        run: |
          set -e

          for app in passenger internal owner
          do

            echo "Sync Capacitor: $app"

            (
              cd "builds/$app"

              npx cap sync android
            )

          done

      # ======================================================
      # 17. BUILD APK HSM TRANSPORT
      # ======================================================

      - name: Build HSM Transport APK

        shell: bash

        run: |
          set -e

          cd builds/passenger/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 18. BUILD APK HSM INTERNAL
      #
      # APK INI MEMILIKI GPS LIVE TRACKING
      # ======================================================

      - name: Build HSM Internal APK

        shell: bash

        run: |
          set -e

          cd builds/internal/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 19. BUILD APK HSM OWNER
      # ======================================================

      - name: Build HSM Owner APK

        shell: bash

        run: |
          set -e

          cd builds/owner/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 20. SIAPKAN HASIL APK
      # ======================================================

      - name: Prepare Three APK Files

        shell: bash

        run: |
          set -e

          mkdir -p output

          cp \
            builds/passenger/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          cp \
            builds/internal/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Internal.apk

          cp \
            builds/owner/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Owner.apk

          echo "Ketiga file APK berhasil dibuat."

          ls -lh output/

      # ======================================================
      # 21. UPLOAD APK HSM TRANSPORT
      # ======================================================

      - name: Upload HSM Transport APK

        uses: actions/upload-artifact@v4

        with:

          name: HSM-Transport-APK

          path: output/HSM-Transport.apk

          retention-days: 30

          if-no-files-found: error

      # ======================================================
      # 22. UPLOAD APK HSM INTERNAL
      # ======================================================

      - name: Upload HSM Internal APK

        uses: actions/upload-artifact@v4

        with:

          name: HSM-Internal-APK

          path: output/HSM-Internal.apk

          retention-days: 30

          if-no-files-found: error

      # ======================================================
      # 23. UPLOAD APK HSM OWNER
      # ======================================================

      - name: Upload HSM Owner APK

        uses: actions/upload-artifact@v4

        with:

          name: HSM-Owner-APK

          path: output/HSM-Owner.apk

          retention-days: 30

          if-no-files-found: error
