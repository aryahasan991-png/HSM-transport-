# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD 3 APK ANDROID
#
# 1. HSM Transport
#    com.hsmtransport.app
#
# 2. HSM Internal
#    com.hsmtransport.internal
#
# 3. HSM Owner
#    com.hsmtransport.owner
#
# Capacitor 8
# ============================================================

name: Build 3 APK HSM

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 3 Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ======================================================
      # 3. JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "true"
          packages: ""

      - name: Install Android Platform
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ======================================================
      # 5. VALIDASI FILE
      # ======================================================

      - name: Validate HSM Files
        shell: bash
        run: |
          set -e

          for file in \
            index.html \
            admin.html \
            petugas.html \
            config.js \
            app.js \
            hsm-logo.png \
            hsm-apk-icon.png \
            hsm-petugas-premium.js \
            hsm-pwa-audio.js \
            hsm_scan_success.wav \
            hsm_scan_error.wav \
            android-app/package.json
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: File tidak ditemukan: $file"
              exit 1
            fi
          done

          echo "File utama HSM tersedia."

      # ======================================================
      # 6. SIAPKAN 3 PROJECT
      # ======================================================

      - name: Prepare Three Capacitor Projects
        shell: bash
        run: |
          set -e

          for app in passenger internal owner
          do
            mkdir -p "builds/$app/www"

            cp android-app/package.json \
              "builds/$app/package.json"
          done

          # Salin aset website utama.
          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json \
            ./*.webmanifest \
            ./*.wav
          do
            if [ -f "$file" ]; then
              for app in passenger internal owner
              do
                cp "$file" "builds/$app/www/"
              done
            fi
          done

          # Folder aset tambahan bila tersedia.
          for folder in assets images img fonts
          do
            if [ -d "$folder" ]; then
              for app in passenger internal owner
              do
                cp -R "$folder" \
                  "builds/$app/www/"
              done
            fi
          done

          # Penumpang tidak memuat portal internal.
          rm -f \
            builds/passenger/www/admin.html \
            builds/passenger/www/petugas.html \
            builds/passenger/www/portal.html \
            builds/passenger/www/admin.js \
            builds/passenger/www/hsm-admin-extra.js \
            builds/passenger/www/hsm-manifest.js \
            builds/passenger/www/hsm-staff-admin.js \
            builds/passenger/www/hsm-trip-monitor.js \
            builds/passenger/www/hsm-trip-corrections.js \
            builds/passenger/www/hsm-site-admin.js \
            builds/passenger/www/hsm-petugas-premium.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          configs = {
              "passenger": {
                  "appId": "com.hsmtransport.app",
                  "appName": "HSM Transport",
                  "webDir": "www",
                  "android": {
                      "backgroundColor": "#ffffff"
                  }
              },
              "internal": {
                  "appId": "com.hsmtransport.internal",
                  "appName": "HSM Internal",
                  "webDir": "www",
                  "android": {
                      "backgroundColor": "#071e42"
                  }
              },
              "owner": {
                  "appId": "com.hsmtransport.owner",
                  "appName": "HSM Owner",
                  "webDir": "www",
                  "android": {
                      "backgroundColor": "#071e42"
                  }
              }
          }

          for name, config in configs.items():
              path = Path(
                  f"builds/{name}/capacitor.config.json"
              )

              path.write_text(
                  json.dumps(config, indent=2),
                  encoding="utf-8"
              )

          print("3 konfigurasi Capacitor siap.")
          PY

      # ======================================================
      # 7. HALAMAN UTAMA HSM INTERNAL
      # ======================================================

      - name: Create HSM Internal Home
        shell: bash
        run: |
          set -e

          cat > builds/internal/www/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >
            <meta name="theme-color" content="#071e42">

            <title>HSM Internal</title>

            <style>
              * {
                box-sizing:border-box;
              }

              body {
                margin:0;
                min-height:100dvh;
                display:grid;
                place-items:center;
                padding:20px;
                background:
                  linear-gradient(
                    150deg,
                    #061936,
                    #0b3975 45%,
                    #dfe8f2 45%
                  );
                font-family:
                  system-ui,
                  -apple-system,
                  sans-serif;
              }

              .card {
                width:100%;
                max-width:430px;
                padding:30px 22px;
                border-radius:22px;
                background:#eaf1f8;
                box-shadow:0 15px 45px #06193630;
                text-align:center;
              }

              .logo {
                display:block;
                width:170px;
                max-width:75%;
                margin:0 auto 20px;
              }

              h1 {
                margin:0;
                color:#071e42;
                font-size:25px;
              }

              .company {
                margin:10px 0 27px;
                color:#687e98;
                font-size:12px;
                line-height:1.7;
              }

              .menu {
                display:flex;
                align-items:center;
                gap:14px;
                margin-top:12px;
                padding:17px;
                border-radius:14px;
                background:
                  linear-gradient(
                    120deg,
                    #0754a6,
                    #0b2a55
                  );
                color:#fff;
                text-align:left;
                text-decoration:none;
              }

              .menu svg {
                width:28px;
                height:28px;
                flex-shrink:0;
                fill:none;
                stroke:currentColor;
                stroke-width:1.7;
                stroke-linecap:round;
                stroke-linejoin:round;
              }

              .menu strong {
                display:block;
                font-size:14px;
              }

              .menu small {
                display:block;
                margin-top:5px;
                opacity:.8;
                font-size:11px;
              }

              .footer {
                margin-top:26px;
                color:#687e98;
                font-size:10px;
              }
            </style>
          </head>

          <body>
            <main class="card">

              <img
                class="logo"
                src="hsm-logo.png"
                alt="HSM Transport"
              >

              <h1>HSM Internal</h1>

              <div class="company">
                PT HIDAYAH SARANA MULIA<br>
                INTERNAL CONTROL CENTER
              </div>

              <a class="menu" href="admin.html">
                <svg viewBox="0 0 24 24">
                  <rect
                    x="4"
                    y="10"
                    width="16"
                    height="11"
                    rx="2"
                  />
                  <path
                    d="M8 10V7a4 4 0 0 1 8 0v3"
                  />
                </svg>

                <span>
                  <strong>Login Admin</strong>
                  <small>Dashboard operasional HSM</small>
                </span>
              </a>

              <a class="menu" href="petugas.html">
                <svg viewBox="0 0 24 24">
                  <rect
                    x="3"
                    y="7"
                    width="18"
                    height="12"
                    rx="3"
                  />
                  <path d="M6 7V4h12v3"/>
                  <path d="M3 12h18"/>
                  <path d="M7 19v2m10-2v2"/>
                </svg>

                <span>
                  <strong>Login Sopir & Kernet</strong>
                  <small>
                    Scan QR, manifest & perjalanan
                  </small>
                </span>
              </a>

              <div class="footer">
                KHUSUS PERSONEL HSM TRANSPORT
              </div>

            </main>
          </body>
          </html>
          HTML

      # ======================================================
      # 8. SIAPKAN HALAMAN HSM OWNER
      # ======================================================

      - name: Prepare HSM Owner Home
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re

                    root = Path(".")
          www = Path("builds/owner/www")

          candidates = [
              Path("owner-app/index.html")
          ]

          source = next(
              (
                  path for path in candidates
                  if path.is_file()
                  and path.stat().st_size > 0
              ),
              None
          )

          if source is None:
              raise RuntimeError(
                  "Halaman HSM Owner tidak ditemukan. "
                  "Periksa apakah nama file Owner adalah "
                  "owner.html, hsm-owner.html, "
                  "owner/index.html, atau "
                  "hsm-owner/index.html."
              )

          # Jika Owner berada dalam folder khusus,
          # salin aset folder tersebut terlebih dahulu.
          if source.parent != root:
              shutil.copytree(
                  source.parent,
                  www,
                  dirs_exist_ok=True
              )

          # Jadikan halaman asli Owner sebagai
          # halaman awal aplikasi.
          shutil.copy2(
              source,
              www / "index.html"
          )

          owner_html = (
              www / "index.html"
          ).read_text(encoding="utf-8")

          if "HSM_OWNER_CONFIG" not in owner_html:
              print(
                  "PERINGATAN: Nama konfigurasi Owner "
                  "tidak ditemukan dalam HTML."
              )

          # Pastikan file config.js yang digunakan
          # oleh halaman Owner menyediakan
          # HSM_OWNER_CONFIG.
          config_file = www / "config.js"

          if not config_file.is_file():
              raise RuntimeError(
                  "config.js untuk HSM Owner "
                  "tidak ditemukan."
              )

          config_text = config_file.read_text(
              encoding="utf-8"
          )

          if "HSM_OWNER_CONFIG" not in config_text:
              raise RuntimeError(
                  "config.js pada APK Owner belum "
                  "menyediakan HSM_OWNER_CONFIG. "
                  "Pastikan konfigurasi Owner yang "
                  "berfungsi di Vercel ikut disalin."
              )

          print(
              "Halaman Owner:",
              source
          )

          print(
              "HSM Owner menggunakan konfigurasi asli."
          )
          PY

      # ======================================================
      # 9. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor Dependencies
        shell: bash
        run: |
          set -e

          for app in passenger internal owner
          do
            echo "Install Capacitor: $app"

            (
              cd "builds/$app"

              npm install \
                --no-audit \
                --no-fund
            )
          done

      # ======================================================
      # 10. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Three Android Projects
        shell: bash
        run: |
          set -e

          for app in passenger internal owner
          do
            echo "Generate Android: $app"

            (
              cd "builds/$app"

              npx cap add android
            )
          done

      # ======================================================
      # 11. GENERATE IKON
      # ======================================================

      - name: Generate HSM App Icons
        shell: bash
        run: |
          set -e

          for app in passenger internal owner
          do
            (
              cd "builds/$app"

              mkdir -p assets

              cp ../../hsm-apk-icon.png \
                assets/icon.png

              npm install \
                --no-save \
                --no-audit \
                --no-fund \
                @capacitor/assets

              npx capacitor-assets generate \
                --android \
                --iconBackgroundColor '#ffffff' \
                --iconBackgroundColorDark '#ffffff'
            )
          done

      # ======================================================
      # 12. AUDIO SCANNER HSM INTERNAL
      # ======================================================

      - name: Install HSM Internal Scanner Sounds
        shell: bash
        run: |
          set -e

          RAW_DIR="builds/internal/android/app/src/main/res/raw"

          mkdir -p "$RAW_DIR"

          cp hsm_scan_success.wav \
            "$RAW_DIR/hsm_scan_success.wav"

          cp hsm_scan_error.wav \
            "$RAW_DIR/hsm_scan_error.wav"

          echo "Audio scanner berhasil dipasang."

      # ======================================================
      # 13. NATIVE AUDIO DAN GETARAN
      # ======================================================

      - name: Configure HSM Internal Android
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "builds/internal/android/app/src/main/java"
          )

          files = list(
              root.rglob("MainActivity.java")
          )

          if len(files) != 1:
              raise RuntimeError(
                  "MainActivity.java tidak ditemukan."
              )

          path = files[0]

          original = path.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not match:
              raise RuntimeError(
                  "Package Java tidak ditemukan."
              )

          package_name = match.group(1)

          code = r"""
          package PACKAGE_NAME;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPressed = 0;

              private SoundPool soundPool;

              private int successSound;
              private int errorSound;

              private boolean successReady = false;
              private boolean errorReady = false;

              private int successStream = 0;
              private int errorStream = 0;

              private final class HSMNativeBridge {

                  @JavascriptInterface
                  public void feedback(boolean success) {

                      runOnUiThread(() -> {

                          WebView webView =
                              getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView == null) {
                              return;
                          }

                          String url = webView.getUrl();

                          if (url == null) {
                              return;
                          }

                          Uri uri = Uri.parse(url);

                          boolean allowed =
                              "https".equals(uri.getScheme()) &&
                              "localhost".equals(uri.getHost()) &&
                              "/petugas.html".equals(uri.getPath());

                          if (!allowed) {
                              return;
                          }

                          playFeedback(success);

                      });
                  }
              }

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  initializeSounds();

                  WebView webView =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (webView != null) {
                      webView.addJavascriptInterface(
                          new HSMNativeBridge(),
                          "HSMNative"
                      );
                  }

                  configureBackButton();
              }

              private void initializeSounds() {

                  AudioAttributes attributes =
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA
                          )
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SONIFICATION
                          )
                          .build();

                  soundPool =
                      new SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(attributes)
                          .build();

                  soundPool.setOnLoadCompleteListener(
                      (pool, sampleId, status) -> {

                          if (status == 0) {
                              if (sampleId == successSound) {
                                  successReady = true;
                              }

                              if (sampleId == errorSound) {
                                  errorReady = true;
                              }
                          }
                      }
                  );

                  successSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_success,
                      1
                  );

                  errorSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_error,
                      1
                  );
              }

              private void playFeedback(boolean success) {
                  playVibration(success);
                  playSound(success);
              }

              private void playSound(boolean success) {

                  if (soundPool == null) {
                      return;
                  }

                  try {

                      if (success) {

                          if (!successReady) {
                              return;
                          }

                          if (successStream != 0) {
                              soundPool.stop(successStream);
                          }

                          successStream = soundPool.play(
                              successSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      } else {

                          if (!errorReady) {
                              return;
                          }

                          if (errorStream != 0) {
                              soundPool.stop(errorStream);
                          }

                          errorStream = soundPool.play(
                              errorSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );
                      }

                  } catch (Exception error) {
                      android.util.Log.e(
                          "HSM",
                          "Scanner audio error",
                          error
                      );
                  }
              }

              private void playVibration(boolean success) {

                  try {

                      Vibrator vibrator =
                          (Vibrator) getSystemService(
                              Context.VIBRATOR_SERVICE
                          );

                      if (
                          vibrator == null ||
                          !vibrator.hasVibrator()
                      ) {
                          return;
                      }

                      long[] pattern = success
                          ? new long[]{0,180}
                          : new long[]{0,100,70,100,70,100};

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {
                          vibrator.vibrate(
                              VibrationEffect.createWaveform(
                                  pattern,
                                  -1
                              )
                          );

                      } else {
                          vibrator.vibrate(
                              pattern,
                              -1
                          );
                      }

                  } catch (Exception error) {
                      android.util.Log.e(
                          "HSM",
                          "Scanner vibration error",
                          error
                      );
                  }
              }

              private void configureBackButton() {

                  getOnBackPressedDispatcher()
                      .addCallback(
                          this,
                          new OnBackPressedCallback(true) {

                              @Override
                              public void handleOnBackPressed() {

                                  WebView webView =
                                      getBridge() == null
                                          ? null
                                          : getBridge().getWebView();

                                  if (webView == null) {
                                      finish();
                                      return;
                                  }

                                  String url = webView.getUrl();
                                  String path = "";

                                  if (url != null) {
                                      String parsed =
                                          Uri.parse(url).getPath();

                                      if (parsed != null) {
                                          path = parsed;
                                      }
                                  }

                                  path = path.toLowerCase(
                                      java.util.Locale.ROOT
                                  );

                                  boolean home =
                                      path.isEmpty() ||
                                      path.equals("/") ||
                                      path.endsWith("/index.html");

                                  boolean staff =
                                      path.endsWith("/petugas.html");

                                  boolean admin =
                                      path.endsWith("/admin.html");

                                  if (staff || admin || !home) {

                                      webView.loadUrl(
                                          "https://localhost/index.html"
                                      );

                                      return;
                                  }

                                  long now =
                                      System.currentTimeMillis();

                                  if (
                                      now - lastBackPressed < 2000
                                  ) {
                                      finish();

                                  } else {
                                      lastBackPressed = now;

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Tekan sekali lagi untuk keluar",
                                          Toast.LENGTH_SHORT
                                      ).show();
                                  }
                              }
                          }
                      );
              }

              @Override
              public void onDestroy() {

                  if (soundPool != null) {
                      soundPool.release();
                      soundPool = null;
                  }

                  super.onDestroy();
              }
          }
          """

          code = code.replace(
              "PACKAGE_NAME",
              package_name
          )

          path.write_text(
              code.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "Native scanner HSM Internal siap."
          )
          PY

      # ======================================================
      # 14. CAMERA + VIBRATION
      # ======================================================

      - name: Enable HSM Internal Permissions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "builds/internal/android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.CAMERA",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:
              if permission not in content:
                  line = (
                      '<uses-permission '
                      'android:name="' +
                      permission +
                      '" />'
                  )

                  content = content.replace(
                      "<application",
                      "    " + line +
                      "\n    <application",
                      1
                  )

          if "android.hardware.camera" not in content:
              content = content.replace(
                  "<application",
                  '    <uses-feature '
                  'android:name="android.hardware.camera" '
                  'android:required="false" />'
                  "\n    <application",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          print("Izin Android Internal siap.")
          PY

      # ======================================================
      # 15. CAPACITOR SYNC
      # ======================================================

      - name: Sync Three Android Projects
        shell: bash
        run: |
          set -e

          for app in passenger internal owner
          do
            (
              cd "builds/$app"

              npx cap sync android
            )
          done

      # ======================================================
      # 16. BUILD APK
      # ======================================================

      - name: Build HSM Transport APK
        shell: bash
        run: |
          set -e

          cd builds/passenger/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Build HSM Internal APK
        shell: bash
        run: |
          set -e

          cd builds/internal/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Build HSM Owner APK
        shell: bash
        run: |
          set -e

          cd builds/owner/android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 17. SIAPKAN 3 FILE APK
      # ======================================================

      - name: Prepare Three APK Files
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            builds/passenger/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          cp \
            builds/internal/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Internal.apk

          cp \
            builds/owner/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Owner.apk

          echo "Ketiga APK berhasil dibuat."

          ls -lh output/

      # ======================================================
      # 18. UPLOAD APK
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload HSM Internal APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Internal-APK
