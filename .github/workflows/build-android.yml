# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD ANDROID APK
#
# FITUR:
# - Website Penumpang
# - Dashboard Admin
# - Portal Sopir & Kernet
# - QR Scanner Otomatis
# - Custom WAV Scanner
# - Native Android Vibration
# - Splash Screen 3 Detik
# - Ikon HSM
# - Android Back Button
#
# FIX:
# Android SDK tidak menginstal paket "tools"
# yang menyebabkan workflow sebelumnya gagal.
# ============================================================

name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:
  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ======================================================
      # 3. JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ======================================================
      # 4. ANDROID SDK - FIX ERROR SEBELUMNYA
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: ""

      # ======================================================
      # 5. INSTALL ANDROID PLATFORM
      # ======================================================

      - name: Install Android Platform
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

          echo "Android SDK berhasil disiapkan."

      # ======================================================
      # 6. VALIDASI FILE
      # ======================================================

      - name: Validate HSM Files
        shell: bash
        run: |
          set -e

          for file in \
            index.html \
            admin.html \
            petugas.html \
            config.js \
            app.js \
            hsm-logo.png \
            hsm-apk-icon.png \
            hsm_scan_success.wav \
            hsm_scan_error.wav \
            android-app/package.json
          do

            if [ ! -s "$file" ]; then
              echo "ERROR: File tidak ditemukan atau kosong: $file"
              exit 1
            fi

          done

          echo "Semua file HSM tersedia."

      # ======================================================
      # 7. PREPARE WEBSITE
      # ======================================================

      - name: Prepare HSM Website
        shell: bash
        run: |
          set -e

          mkdir -p android-app/www

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json
          do

            if [ -f "$file" ]; then
              cp "$file" android-app/www/
            fi

          done

          echo "Website HSM berhasil disalin."

      # ======================================================
      # 8. PORTAL INTERNAL DAN SPLASH SCREEN
      # ======================================================

      - name: Prepare Internal Portal and Splash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          web = Path("android-app/www")

          portal = web / "portal.html"

          if not portal.exists():
              portal.write_text("""
          <!DOCTYPE html>
          <html lang="id">

          <head>
            <meta charset="UTF-8">
            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <title>Portal Internal HSM Transport</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                min-height: 100vh;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f4f7fb;
                font-family: Arial, sans-serif;
              }

              .card {
                width: 100%;
                max-width: 430px;
                padding: 30px 22px;
                border-radius: 18px;
                background: white;
                text-align: center;
                box-shadow: 0 8px 28px rgba(0,0,0,.08);
              }

              h1 {
                color: #0754a6;
                font-size: 27px;
                margin: 0 0 10px;
              }

              p {
                color: #64748b;
                font-size: 14px;
                line-height: 1.7;
                margin-bottom: 25px;
              }

              a {
                display: block;
                margin-top: 13px;
                padding: 16px;
                border-radius: 11px;
                background: #0754a6;
                color: white;
                text-decoration: none;
                font-weight: bold;
              }

              a.secondary {
                background: #e2e8f0;
                color: #334155;
              }

              .footer {
                margin-top: 25px;
                color: #94a3b8;
                font-size: 11px;
              }
            </style>
          </head>

          <body>
            <main class="card">

              <h1>HSM Transport</h1>

              <p>
                Portal Internal<br>
                PT Hidayah Sarana Mulia
              </p>

              <a href="admin.html">
                🔐 Dashboard Admin
              </a>

              <a href="petugas.html">
                🚐 Portal Sopir & Kernet
              </a>

              <a href="index.html" class="secondary">
                Kembali ke Penumpang
              </a>

              <div class="footer">
                HSM Transport © 2026
              </div>

            </main>
          </body>
          </html>
          """, encoding="utf-8")

          index = web / "index.html"

          html = index.read_text(encoding="utf-8")

          def insert_before_body(content, addition):
              position = content.lower().rfind("</body>")

              if position < 0:
                  raise RuntimeError(
                      "Tag </body> tidak ditemukan."
                  )

              return (
                  content[:position] +
                  addition +
                  "\n" +
                  content[position:]
              )

          if "hsm-apk-internal-access" not in html:
              internal_link = """
          <div
            id="hsm-apk-internal-access"
            style="
              text-align:center;
              padding:16px;
              background:#f5f7fa;
            "
          >
            <a
              href="portal.html"
              style="
                color:#64748b;
                font-size:12px;
                text-decoration:none;
              "
            >
              🔐 Akses Internal HSM
            </a>
          </div>
          """

              html = insert_before_body(
                  html,
                  internal_link
              )

          if "hsm-custom-splash" not in html:
              splash = """
          <style>
            #hsm-custom-splash {
              position: fixed;
              inset: 0;
              z-index: 2147483647;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              padding: 24px;
              text-align: center;
              background: white;
              opacity: 1;
              transition: opacity .4s ease;
            }

            #hsm-custom-splash.hsm-hide {
              opacity: 0;
              pointer-events: none;
            }

            #hsm-custom-splash img {
              width: min(55vw,230px);
              max-height: 230px;
              object-fit: contain;
              margin-bottom: 35px;
            }

            .hsm-splash-title {
              color: #0754a6;
              font-family: Arial,sans-serif;
              font-size: 22px;
              font-weight: 800;
              letter-spacing: 1px;
              margin-bottom: 12px;
            }

            .hsm-splash-tagline {
              color: #64748b;
              font-family: Arial,sans-serif;
              font-size: 14px;
              line-height: 1.6;
            }

            .hsm-splash-company {
              position: absolute;
              bottom: 45px;
              left: 15px;
              right: 15px;
              color: #0754a6;
              font-family: Arial,sans-serif;
              font-size: 11px;
              font-weight: 700;
              letter-spacing: 1px;
            }
          </style>

          <div id="hsm-custom-splash">

            <img
              src="hsm-logo.png"
              alt="HSM Transport"
            >

            <div class="hsm-splash-title">
              SELAMAT DATANG
            </div>

            <div class="hsm-splash-tagline">
              Perjalanan Nyaman, Pilihan Tepat.
            </div>

            <div class="hsm-splash-company">
              PT HIDAYAH SARANA MULIA
            </div>

          </div>

          <script>
          (function(){

            function closeSplash(){

              var splash =
                document.getElementById(
                  "hsm-custom-splash"
                );

              if (!splash) return;

              setTimeout(function(){

                splash.classList.add("hsm-hide");

                setTimeout(function(){
                  splash.remove();
                },450);

              },3000);

            }

            if (document.readyState === "loading") {

              document.addEventListener(
                "DOMContentLoaded",
                closeSplash,
                {once:true}
              );

            } else {

              closeSplash();

            }

          })();
          </script>
          """

              html = insert_before_body(
                  html,
                  splash
              )

          index.write_text(
              html,
              encoding="utf-8"
          )

          print("Portal internal dan splash siap.")
          PY

      # ======================================================
      # 9. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor
        working-directory: android-app
        shell: bash
        run: |
          npm install --no-audit --no-fund

      # ======================================================
      # 10. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android Project
        working-directory: android-app
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then

            echo "Android project sudah tersedia."

          else

            npx cap add android

          fi

      # ======================================================
      # 11. INSTALL CUSTOM SCANNER AUDIO
      # ======================================================

      - name: Install HSM Custom Scanner Sounds
        shell: bash
        run: |
          set -e

          AUDIO_DIR="android-app/android/app/src/main/res/raw"

          mkdir -p "$AUDIO_DIR"

          cp \
            hsm_scan_success.wav \
            "$AUDIO_DIR/hsm_scan_success.wav"

          cp \
            hsm_scan_error.wav \
            "$AUDIO_DIR/hsm_scan_error.wav"

          echo "Suara scanner berhasil dipasang."

          ls -lh "$AUDIO_DIR"

      # ======================================================
      # 12. NATIVE ANDROID SOUND AND VIBRATION
      # ======================================================

      - name: Configure HSM Native Android Features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "android-app/android/app/src/main/java"
          )

          files = list(root.rglob("MainActivity.java"))

          if len(files) != 1:
              raise RuntimeError(
                  "MainActivity.java tidak ditemukan atau ganda."
              )

          path = files[0]

          original = path.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not match:
              raise RuntimeError(
                  "Package Java tidak ditemukan."
              )

          package_name = match.group(1)

          code = r"""
          package PACKAGE_NAME;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.SoundPool;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPressed = 0;

              private SoundPool soundPool;

              private int successSound;
              private int errorSound;

              private boolean successReady = false;
              private boolean errorReady = false;

              private int successStream = 0;
              private int errorStream = 0;

              private final class HSMNativeBridge {

                  @JavascriptInterface
                  public void feedback(boolean success) {

                      runOnUiThread(() -> {

                          WebView webView =
                              getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView == null) {
                              return;
                          }

                          String url = webView.getUrl();

                          if (url == null) {
                              return;
                          }

                          Uri uri = Uri.parse(url);

                          boolean allowed =
                              "https".equals(uri.getScheme()) &&
                              "localhost".equals(uri.getHost()) &&
                              "/petugas.html".equals(uri.getPath());

                          if (!allowed) {
                              return;
                          }

                          playFeedback(success);

                      });

                  }

              }

              @Override
              public void onCreate(Bundle state) {

                  super.onCreate(state);

                  initializeSounds();

                  WebView webView =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (webView != null) {

                      webView.addJavascriptInterface(
                          new HSMNativeBridge(),
                          "HSMNative"
                      );

                  }

                  configureBackButton();

              }

              // ============================================
              // LOAD CUSTOM WAV
              // ============================================

              private void initializeSounds() {

                  AudioAttributes attributes =
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_MEDIA
                          )
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SONIFICATION
                          )
                          .build();

                  soundPool =
                      new SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(attributes)
                          .build();

                  soundPool.setOnLoadCompleteListener(
                      (pool, sampleId, status) -> {

                          if (status == 0) {

                              if (sampleId == successSound) {
                                  successReady = true;
                              }

                              if (sampleId == errorSound) {
                                  errorReady = true;
                              }

                          }

                      }
                  );

                  successSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_success,
                      1
                  );

                  errorSound = soundPool.load(
                      this,
                      R.raw.hsm_scan_error,
                      1
                  );

              }

              // ============================================
              // FEEDBACK SCANNER
              // ============================================

              private void playFeedback(boolean success) {

                  playVibration(success);
                  playSound(success);

              }

              // ============================================
              // CUSTOM AUDIO
              // ============================================

              private void playSound(boolean success) {

                  if (soundPool == null) {
                      return;
                  }

                  try {

                      if (success) {

                          if (!successReady) {
                              return;
                          }

                          if (successStream != 0) {
                              soundPool.stop(successStream);
                          }

                          successStream = soundPool.play(
                              successSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      } else {

                          if (!errorReady) {
                              return;
                          }

                          if (errorStream != 0) {
                              soundPool.stop(errorStream);
                          }

                          errorStream = soundPool.play(
                              errorSound,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner audio error",
                          error
                      );

                  }

              }

              // ============================================
              // VIBRATION
              // ============================================

              private void playVibration(boolean success) {

                  try {

                      Vibrator vibrator =
                          (Vibrator) getSystemService(
                              Context.VIBRATOR_SERVICE
                          );

                      if (
                          vibrator == null ||
                          !vibrator.hasVibrator()
                      ) {
                          return;
                      }

                      long[] pattern = success
                          ? new long[]{0,180}
                          : new long[]{0,100,70,100,70,100};

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          vibrator.vibrate(
                              VibrationEffect.createWaveform(
                                  pattern,
                                  -1
                              )
                          );

                      } else {

                          vibrator.vibrate(
                              pattern,
                              -1
                          );

                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner vibration error",
                          error
                      );

                  }

              }

              // ============================================
              // ANDROID BACK BUTTON
              // ============================================

              private void configureBackButton() {

                  getOnBackPressedDispatcher()
                      .addCallback(
                          this,
                          new OnBackPressedCallback(true) {

                              @Override
                              public void handleOnBackPressed() {

                                  WebView webView =
                                      getBridge() == null
                                          ? null
                                          : getBridge().getWebView();

                                  if (webView == null) {
                                      finish();
                                      return;
                                  }

                                  String url = webView.getUrl();
                                  String path = "";

                                  if (url != null) {

                                      String parsed =
                                          Uri.parse(url).getPath();

                                      if (parsed != null) {
                                          path = parsed;
                                      }

                                  }

                                  path = path.toLowerCase(
                                      java.util.Locale.ROOT
                                  );

                                  boolean home =
                                      path.isEmpty() ||
                                      path.equals("/") ||
                                      path.endsWith("/index.html");

                                  boolean portal =
                                      path.endsWith("/portal.html");

                                  boolean staff =
                                      path.endsWith("/petugas.html");

                                  boolean admin =
                                      path.endsWith("/admin.html");

                                  if (staff || admin) {

                                      webView.loadUrl(
                                          "https://localhost/portal.html"
                                      );

                                      return;
                                  }

                                  if (portal) {

                                      webView.loadUrl(
                                          "https://localhost/index.html"
                                      );

                                      return;
                                  }

                                  if (!home) {

                                      webView.loadUrl(
                                          "https://localhost/index.html"
                                      );

                                      return;
                                  }

                                  long now =
                                      System.currentTimeMillis();

                                  if (
                                      now - lastBackPressed < 2000
                                  ) {

                                      finish();

                                  } else {

                                      lastBackPressed = now;

                                      Toast.makeText(
                                          MainActivity.this,
                                          "Tekan sekali lagi untuk keluar dari HSM Transport",
                                          Toast.LENGTH_SHORT
                                      ).show();

                                  }

                              }

                          }
                      );

              }

              @Override
              protected void onDestroy() {

                  if (soundPool != null) {

                      soundPool.release();

                      soundPool = null;

                  }

                  super.onDestroy();

              }

          }
          """

          code = code.replace(
              "PACKAGE_NAME",
              package_name
          )

          path.write_text(
              code.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "Native scanner audio dan getaran siap."
          )
          PY

      # ======================================================
      # 13. ANDROID PERMISSIONS
      # ======================================================

      - name: Enable Android Permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "android-app/android/app/src/main/AndroidManifest.xml"
          )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              "android.permission.CAMERA",
              "android.permission.VIBRATE"
          ]

          for permission in permissions:

              if permission not in content:

                  line = (
                      '<uses-permission '
                      'android:name="' +
                      permission +
                      '" />'
                  )

                  content = content.replace(
                      "<application",
                      "    " + line +
                      "\n\n    <application",
                      1
                  )

          if "android.hardware.camera" not in content:

              line = (
                  '<uses-feature '
                  'android:name="android.hardware.camera" '
                  'android:required="false" />'
              )

              content = content.replace(
                  "<application",
                  "    " + line +
                  "\n\n    <application",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          print("Izin kamera dan getaran siap.")
          PY

      # ======================================================
      # 14. GENERATE APP ICON
      # ======================================================

      - name: Generate HSM App Icon
        working-directory: android-app
        shell: bash
        run: |
          set -e

          mkdir -p assets

          cp \
            ../hsm-apk-icon.png \
            assets/icon.png

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            @capacitor/assets

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

      # ======================================================
      # 15. SYNC ANDROID
      # ======================================================

      - name: Sync Android
        working-directory: android-app
        shell: bash
        run: |
          npx cap sync android

      # ======================================================
      # 16. VERIFY SCANNER AUDIO
      # ======================================================

      - name: Verify HSM Scanner Sounds
        shell: bash
        run: |
          set -e

          RAW="android-app/android/app/src/main/res/raw"

          test -s "$RAW/hsm_scan_success.wav"

          test -s "$RAW/hsm_scan_error.wav"

          echo "Suara scanner siap."

          ls -lh "$RAW"

      # ======================================================
      # 17. BUILD APK
      # ======================================================

      - name: Build APK
        working-directory: android-app/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 18. RENAME APK
      # ======================================================

      - name: Rename APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          echo "APK HSM Transport berhasil dibuat."

          ls -lh output/

      # ======================================================
      # 19. UPLOAD APK
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error
