# ============================================================
# HSM TRANSPORT
# PT HIDAYAH SARANA MULIA
#
# BUILD APK ANDROID - CAPACITOR
#
# FITUR:
# - Website penumpang
# - Portal internal APK
# - Dashboard admin
# - Portal sopir dan kernet
# - Splash screen 3 detik
# - Ikon HSM
# - Tombol Back Android
# - Kamera QR Code
# - Scanner boarding otomatis
# - Suara WAV native Android
# - Getaran native Android
#
# SUARA:
# BERHASIL: 1 BIP BANDARA
# GAGAL:    3 BIP PERINGATAN
#
# WEBSITE VERCEL TIDAK DIUBAH
#
# OUTPUT:
# HSM-Transport.apk
# ============================================================

name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:
  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ======================================================
      # 3. JAVA
      # ======================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ======================================================
      # 4. ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: "false"
          packages: ""

      # ======================================================
      # 5. SDK LICENSES
      # ======================================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +o pipefail

          yes | sdkmanager --licenses > /dev/null

          result=${PIPESTATUS[1]}

          set -o pipefail

          if [ "$result" -ne 0 ]; then
            echo "Gagal menerima lisensi Android SDK."
            exit "$result"
          fi

      # ======================================================
      # 6. ANDROID PLATFORM
      # ======================================================

      - name: Install Android Platform
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ======================================================
      # 7. WEBSITE HSM
      # ======================================================

      - name: Prepare HSM Website
        shell: bash
        run: |
          mkdir -p android-app/www

          for file in \
            ./*.html \
            ./*.js \
            ./*.css \
            ./*.png \
            ./*.jpg \
            ./*.jpeg \
            ./*.webp \
            ./*.svg \
            ./*.ico \
            ./*.json
          do
            if [ -f "$file" ]; then
              cp "$file" android-app/www/
            fi
          done

          test -f android-app/www/index.html
          test -f android-app/www/admin.html
          test -f android-app/www/petugas.html
          test -f android-app/www/config.js
          test -f android-app/www/app.js

          echo "Website HSM siap."

      # ======================================================
      # 8. PORTAL INTERNAL
      # ======================================================

      - name: Prepare APK Internal Portal
        shell: bash
        run: |
          if [ ! -f android-app/www/portal.html ]; then

            cat > android-app/www/portal.html <<'HTML'
          <!DOCTYPE html>
          <html lang="id">

          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width,initial-scale=1"
            >

            <meta
              name="theme-color"
              content="#0754a6"
            >

            <title>Portal Internal HSM Transport</title>

            <style>
              *{box-sizing:border-box}

              body{
                margin:0;
                padding:20px;
                min-height:100vh;
                font-family:Arial,sans-serif;
                background:#f4f7fb;
                display:flex;
                align-items:center;
                justify-content:center
              }

              .card{
                width:100%;
                max-width:440px;
                padding:28px 22px;
                background:white;
                border-radius:18px;
                text-align:center;
                box-shadow:0 8px 28px rgba(0,0,0,.08)
              }

              h1{
                color:#0754a6;
                font-size:24px
              }

              p{
                color:#64748b;
                line-height:1.7
              }

              a{
                display:block;
                margin-top:14px;
                padding:15px;
                border-radius:11px;
                background:#0754a6;
                color:white;
                font-weight:bold;
                text-decoration:none
              }

              a.secondary{
                background:#e2e8f0;
                color:#334155
              }
            </style>
          </head>

          <body>
            <main class="card">

              <h1>HSM Transport</h1>

              <p>
                Portal Internal<br>
                PT Hidayah Sarana Mulia
              </p>

              <a href="admin.html">
                🔐 Dashboard Admin
              </a>

              <a href="petugas.html">
                🚐 Portal Sopir & Kernet
              </a>

              <a href="index.html" class="secondary">
                Kembali ke Penumpang
              </a>

            </main>
          </body>

          </html>
          HTML

          fi

      # ======================================================
      # 9. AKSES INTERNAL
      # ======================================================

      - name: Add APK Internal Access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android-app/www/index.html")
          html = path.read_text(encoding="utf-8")

          marker = "hsm-apk-internal-access"

          if marker not in html:
              link = '''
          <div
            id="hsm-apk-internal-access"
            style="
              text-align:center;
              padding:16px;
              background:#f5f7fa;
            "
          >
            <a
              href="portal.html"
              style="
                color:#64748b;
                font-size:12px;
                text-decoration:none;
              "
            >
              🔐 Akses Internal HSM
            </a>
          </div>
          '''

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag body tidak ditemukan."
                  )

              position = html.rfind("</body>")

              html = (
                  html[:position]
                  + link
                  + "\n"
                  + html[position:]
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print("Akses internal APK siap.")
          PY

      # ======================================================
      # 10. LOGO SPLASH
      # ======================================================

      - name: Copy HSM Splash Logo
        shell: bash
        run: |
          if [ ! -f hsm-logo.png ]; then
            echo "ERROR: hsm-logo.png tidak ditemukan."
            exit 1
          fi

          mkdir -p android-app/www

          cp hsm-logo.png android-app/www/hsm-logo.png

      # ======================================================
      # 11. SPLASH SCREEN 3 DETIK
      # ======================================================

      - name: Add HSM Splash Screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android-app/www/index.html")
          html = path.read_text(encoding="utf-8")

          if "hsm-custom-splash" not in html:
              splash = """
          <!-- HSM CUSTOM SPLASH SCREEN -->

          <style>
            #hsm-custom-splash{
              position:fixed;
              inset:0;
              z-index:2147483647;
              display:flex;
              flex-direction:column;
              justify-content:center;
              align-items:center;
              background:#ffffff;
              padding:24px;
              text-align:center;
              opacity:1;
              transition:opacity .4s ease
            }

            #hsm-custom-splash.hsm-hide{
              opacity:0;
              pointer-events:none
            }

            #hsm-custom-splash .hsm-splash-logo{
              width:min(55vw,230px);
              max-height:230px;
              object-fit:contain;
              margin-bottom:35px;
              animation:hsmFadeIn .9s ease both
            }

            #hsm-custom-splash .hsm-splash-welcome{
              color:#0754a6;
              font-family:Arial,sans-serif;
              font-size:22px;
              font-weight:800;
              letter-spacing:1px;
              margin-bottom:12px;
              animation:hsmFadeIn 1.1s ease both
            }

            #hsm-custom-splash .hsm-splash-tagline{
              color:#64748b;
              font-family:Arial,sans-serif;
              font-size:14px;
              line-height:1.6;
              animation:hsmFadeIn 1.3s ease both
            }

            #hsm-custom-splash .hsm-splash-company{
              position:absolute;
              bottom:45px;
              left:15px;
              right:15px;
              color:#0754a6;
              font-family:Arial,sans-serif;
              font-size:11px;
              font-weight:700;
              letter-spacing:1px;
              animation:hsmFadeIn 1.5s ease both
            }

            @keyframes hsmFadeIn{
              from{
                opacity:0;
                transform:translateY(15px)
              }
              to{
                opacity:1;
                transform:translateY(0)
              }
            }
          </style>

          <div id="hsm-custom-splash">

            <img
              class="hsm-splash-logo"
              src="hsm-logo.png"
              alt="HSM Transport"
            >

            <div class="hsm-splash-welcome">
              SELAMAT DATANG
            </div>

            <div class="hsm-splash-tagline">
              Perjalanan Nyaman, Pilihan Tepat.
            </div>

            <div class="hsm-splash-company">
              PT HIDAYAH SARANA MULIA
            </div>

          </div>

          <script>
          (function(){
            function closeSplash(){
              var splash=document.getElementById(
                "hsm-custom-splash"
              );

              if(!splash)return;

              setTimeout(function(){
                splash.classList.add("hsm-hide");

                setTimeout(function(){
                  splash.remove();
                },450);

              },3000);
            }

            if(document.readyState==="loading"){
              document.addEventListener(
                "DOMContentLoaded",
                closeSplash,
                {once:true}
              );
            }else{
              closeSplash();
            }
          })();
          </script>

          <!-- END HSM CUSTOM SPLASH SCREEN -->
          """

              if "</body>" not in html:
                  raise RuntimeError(
                      "Tag body tidak ditemukan."
                  )

              position = html.rfind("</body>")

              html = (
                  html[:position]
                  + splash
                  + "\n"
                  + html[position:]
              )

              path.write_text(
                  html,
                  encoding="utf-8"
              )

          print("Splash screen siap.")
          PY

      # ======================================================
      # 12. INSTALL CAPACITOR
      # ======================================================

      - name: Install Capacitor
        working-directory: android-app
        shell: bash
        run: |
          npm install --no-audit --no-fund

      # ======================================================
      # 13. GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android Project
        working-directory: android-app
        shell: bash
        run: |
          npx cap add android

      # ======================================================
      # 14. GENERATE SUARA BOARDING BANDARA
      #
      # Dibuat langsung dari Python.
      # Menghasilkan WAV tanpa file eksternal.
      #
      # SUCCESS:
      # Satu beep naik yang pendek.
      #
      # ERROR:
      # Tiga beep peringatan bernada rendah.
      # ======================================================

      - name: Generate HSM Airport Scanner Sounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import wave
          import struct

          target = Path(
              "android-app/android/app/src/main/res/raw"
          )

          target.mkdir(
              parents=True,
              exist_ok=True
          )

          RATE = 44100

          def make_sound(
              filename,
              segments
          ):
              samples = []

              for start_freq, end_freq, duration, silence in segments:

                  count = int(RATE * duration)

                  for i in range(count):
                      progress = i / max(count - 1, 1)
                      t = i / RATE

                      freq = (
                          start_freq +
                          (end_freq - start_freq) * progress
                      )

                      phase = (
                          2 * math.pi *
                          (
                              start_freq * t +
                              0.5 *
                              (end_freq - start_freq) *
                              t * t / duration
                          )
                      )

                      attack = min(
                          1.0,
                          i / max(1, int(RATE * .008))
                      )

                      release = min(
                          1.0,
                          (count - i) /
                          max(1, int(RATE * .025))
                      )

                      envelope = max(
                          0.0,
                          min(attack, release)
                      )

                      main = math.sin(phase)

                      overtone = math.sin(
                          2 * phase
                      )

                      signal = (
                          main * 0.88 +
                          overtone * 0.12
                      )

                      value = int(
                          26000 *
                          signal *
                          envelope
                      )

                      value = max(
                          -32767,
                          min(32767, value)
                      )

                      samples.append(value)

                  samples.extend(
                      [0] * int(RATE * silence)
                  )

              path = target / filename

              with wave.open(str(path), "wb") as output:
                  output.setnchannels(1)
                  output.setsampwidth(2)
                  output.setframerate(RATE)

                  output.writeframes(
                      struct.pack(
                          "<" + "h" * len(samples),
                          *samples
                      )
                  )

              print(
                  "Suara berhasil dibuat:",
                  path,
                  path.stat().st_size,
                  "bytes"
              )

          # Suara boarding berhasil:
          # Satu bip jernih dengan nada naik.
          make_sound(
              "hsm_scan_success.wav",
              [
                  (1170, 1510, 0.19, 0.0)
              ]
          )

          # Suara boarding gagal:
          # Tiga bip peringatan.
          make_sound(
              "hsm_scan_error.wav",
              [
                  (700, 560, 0.12, 0.065),
                  (700, 560, 0.12, 0.065),
                  (700, 560, 0.12, 0.0)
              ]
          )
          PY

      # ======================================================
      # 15. MAINACTIVITY ANDROID
      #
      # - Back Android
      # - JavaScript bridge aman untuk petugas.html
      # - SoundPool memutar WAV native
      # - Getaran native
      #
      # Catatan:
      # Bridge hanya memproses feedback jika
      # WebView berada di halaman petugas lokal.
      # ======================================================

      - name: Configure HSM Native Android Features
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_root = Path(
              "android-app/android/app/src/main/java"
          )

          files = list(
              java_root.rglob("MainActivity.java")
          )

          if len(files) != 1:
              raise RuntimeError(
                  "MainActivity.java tidak ditemukan atau ganda."
              )

          path = files[0]

          original = path.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"^\s*package\s+([\w.]+)\s*;",
              original,
              re.M
          )

          if not match:
              raise RuntimeError(
                  "Package Android tidak ditemukan."
              )

          package_name = match.group(1)

          code = r"""
          package PACKAGE_NAME;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.SoundPool;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;

          import androidx.activity.OnBackPressedCallback;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private long lastBackPressed = 0;

              private SoundPool hsmSoundPool;

              private int successSoundId = 0;
              private int errorSoundId = 0;

              private boolean successSoundReady = false;
              private boolean errorSoundReady = false;

              private int successStreamId = 0;
              private int errorStreamId = 0;

              private final class HSMNativeBridge {

                  @JavascriptInterface
                  public void feedback(boolean success) {

                      runOnUiThread(() -> {

                          WebView webView =
                              getBridge() == null
                                  ? null
                                  : getBridge().getWebView();

                          if (webView == null) {
                              return;
                          }

                          String url = webView.getUrl();

                          if (url == null) {
                              return;
                          }

                          Uri uri = Uri.parse(url);

                          boolean allowed =
                              "https".equals(
                                  uri.getScheme()
                              ) &&
                              "localhost".equals(
                                  uri.getHost()
                              ) &&
                              "/petugas.html".equals(
                                  uri.getPath()
                              );

                          if (!allowed) {
                              return;
                          }

                          playHSMFeedback(success);

                      });
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  initializeHSMSounds();

                  WebView webView =
                      getBridge() == null
                          ? null
                          : getBridge().getWebView();

                  if (webView != null) {

                      webView.addJavascriptInterface(
                          new HSMNativeBridge(),
                          "HSMNative"
                      );
                  }

                  configureBackButton();
              }

              // =============================================
              // SOUNDPOOL
              // =============================================

              private void initializeHSMSounds() {

                  AudioAttributes attributes =
                      new AudioAttributes.Builder()
                          .setUsage(
                              AudioAttributes.USAGE_ASSISTANCE_SONIFICATION
                          )
                          .setContentType(
                              AudioAttributes.CONTENT_TYPE_SONIFICATION
                          )
                          .build();

                  hsmSoundPool =
                      new SoundPool.Builder()
                          .setMaxStreams(2)
                          .setAudioAttributes(attributes)
                          .build();

                  hsmSoundPool.setOnLoadCompleteListener(
                      (soundPool, sampleId, status) -> {

                          if (status == 0) {

                              if (sampleId == successSoundId) {
                                  successSoundReady = true;
                              }

                              if (sampleId == errorSoundId) {
                                  errorSoundReady = true;
                              }
                          }
                      }
                  );

                  successSoundId = hsmSoundPool.load(
                      this,
                      R.raw.hsm_scan_success,
                      1
                  );

                  errorSoundId = hsmSoundPool.load(
                      this,
                      R.raw.hsm_scan_error,
                      1
                  );
              }

              // =============================================
              // FEEDBACK UTAMA
              // =============================================

              private void playHSMFeedback(boolean success) {

                  playHSMVibration(success);
                  playHSMSound(success);
              }

              // =============================================
              // WAV SCANNER BANDARA
              // =============================================

              private void playHSMSound(boolean success) {

                  if (hsmSoundPool == null) {
                      return;
                  }

                  try {

                      if (success) {

                          if (!successSoundReady) {
                              return;
                          }

                          if (successStreamId != 0) {
                              hsmSoundPool.stop(successStreamId);
                          }

                          successStreamId = hsmSoundPool.play(
                              successSoundId,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );

                      } else {

                          if (!errorSoundReady) {
                              return;
                          }

                          if (errorStreamId != 0) {
                              hsmSoundPool.stop(errorStreamId);
                          }

                          errorStreamId = hsmSoundPool.play(
                              errorSoundId,
                              1.0f,
                              1.0f,
                              1,
                              0,
                              1.0f
                          );
                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner sound failed",
                          error
                      );
                  }
              }

              // =============================================
              // GETARAN SCANNER
              // =============================================

              private void playHSMVibration(boolean success) {

                  try {

                      Vibrator vibrator =
                          (Vibrator) getSystemService(
                              Context.VIBRATOR_SERVICE
                          );

                      if (
                          vibrator == null ||
                          !vibrator.hasVibrator()
                      ) {
                          return;
                      }

                      long[] pattern = success
                          ? new long[]{0, 180}
                          : new long[]{0, 100, 70, 100, 70, 100};

                      if (
                          Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O
                      ) {

                          vibrator.vibrate(
                              VibrationEffect.createWaveform(
                                  pattern,
                                  -1
                              )
                          );

                      } else {

                          vibrator.vibrate(
                              pattern,
                              -1
                          );
                      }

                  } catch (Exception error) {

                      android.util.Log.e(
                          "HSM",
                          "Scanner vibration failed",
                          error
                      );
                  }
              }

              // =============================================
              // TOMBOL BACK ANDROID
              // =============================================

              private void configureBackButton() {

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {

                          @Override
                          public void handleOnBackPressed() {

                              WebView webView =
                                  getBridge() == null
                                      ? null
                                      : getBridge().getWebView();

                              if (webView == null) {
                                  finish();
                                  return;
                              }

                              String url = webView.getUrl();
                              String path = "";

                              if (url != null) {

                                  String parsedPath =
                                      Uri.parse(url).getPath();

                                  if (parsedPath != null) {
                                      path = parsedPath;
                                  }
                              }

                              path = path.toLowerCase(
                                  java.util.Locale.ROOT
                              );

                              boolean isHome =
                                  path.isEmpty() ||
                                  path.equals("/") ||
                                  path.endsWith("/index.html");

                              boolean isPortal =
                                  path.endsWith("/portal.html");

                              boolean isStaff =
                                  path.endsWith("/petugas.html");

                              boolean isAdmin =
                                  path.endsWith("/admin.html");

                              if (isStaff || isAdmin) {

                                  webView.loadUrl(
                                      "https://localhost/portal.html"
                                  );

                                  return;
                              }

                              if (isPortal) {

                                  webView.loadUrl(
                                      "https://localhost/index.html"
                                  );

                                  return;
                              }

                              if (!isHome) {

                                  webView.loadUrl(
                                      "https://localhost/index.html"
                                  );

                                  return;
                              }

                              long now =
                                  System.currentTimeMillis();

                              if (now - lastBackPressed < 2000) {

                                  finish();

                              } else {

                                  lastBackPressed = now;

                                  Toast.makeText(
                                      MainActivity.this,
                                      "Tekan sekali lagi untuk keluar dari HSM Transport",
                                      Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                      }
                  );
              }

              @Override
              protected void onDestroy() {

                  if (hsmSoundPool != null) {
                      hsmSoundPool.release();
                      hsmSoundPool = null;
                  }

                  super.onDestroy();
              }
          }
          """

          code = code.replace(
              "PACKAGE_NAME",
              package_name
          )

          path.write_text(
              code.strip() + "\n",
              encoding="utf-8"
          )

          print(
              "MainActivity HSM dengan suara WAV native "
              "dan getaran Android berhasil dibuat."
          )
          PY

      # ======================================================
      # 16. CAMERA + VIBRATE PERMISSIONS
      # ======================================================

      - name: Enable HSM Android Permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path(
              "android-app/android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise RuntimeError(
                  "AndroidManifest.xml tidak ditemukan."
              )

          content = manifest.read_text(
              encoding="utf-8"
          )

          permissions = [
              (
                  "android.permission.CAMERA",
                  '<uses-permission '
                  'android:name="android.permission.CAMERA" />'
              ),
              (
                  "android.permission.VIBRATE",
                  '<uses-permission '
                  'android:name="android.permission.VIBRATE" />'
              )
          ]

          for permission_name, xml in permissions:

              if permission_name not in content:

                  if "<application" not in content:
                      raise RuntimeError(
                          "Tag application tidak ditemukan."
                      )

                  content = content.replace(
                      "<application",
                      "    " + xml +
                      "\n\n    <application",
                      1
                  )

          camera_feature = (
              '<uses-feature '
              'android:name="android.hardware.camera" '
              'android:required="false" />'
          )

          if "android.hardware.camera" not in content:

              content = content.replace(
                  "<application",
                  "    " + camera_feature +
                  "\n\n    <application",
                  1
              )

          manifest.write_text(
              content,
              encoding="utf-8"
          )

          ET.parse(manifest)

          print(
              "Izin CAMERA dan VIBRATE siap."
          )
          PY

      # ======================================================
      # 17. GENERATE IKON HSM
      # ======================================================

      - name: Generate HSM Transport App Icon
        working-directory: android-app
        shell: bash
        run: |
          if [ ! -f ../hsm-apk-icon.png ]; then
            echo "ERROR: hsm-apk-icon.png tidak ditemukan!"
            exit 1
          fi

          mkdir -p assets

          cp ../hsm-apk-icon.png assets/icon.png

          npm install \
            --no-save \
            --no-audit \
            --no-fund \
            @capacitor/assets

          npx capacitor-assets generate \
            --android \
            --iconBackgroundColor '#ffffff' \
            --iconBackgroundColorDark '#ffffff'

          echo "Ikon resmi HSM siap."

      # ======================================================
      # 18. CAPACITOR SYNC
      # ======================================================

      - name: Sync Android
        working-directory: android-app
        shell: bash
        run: |
          npx cap sync android

      # ======================================================
      # 19. BUILD APK
      # ======================================================

      - name: Build APK
        working-directory: android-app/android
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # ======================================================
      # 20. RENAME APK
      # ======================================================

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            output/HSM-Transport.apk

          echo "APK HSM Transport berhasil dibuat."

          ls -lh output/

      # ======================================================
      # 21. UPLOAD APK
      # ======================================================

      - name: Upload HSM Transport APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-APK
          path: output/HSM-Transport.apk
          retention-days: 30
          if-no-files-found: error
