<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0754a6"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>Admin HSM Transport</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- BARCODE -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #0754a6;
      --dark: #172033;
      --muted: #667085;
      --border: #e1e7ef;
      --bg: #f4f7fb;
      --green: #16a34a;
      --yellow: #d99b00;
      --red: #dc2626;
      --purple: #7c3aed;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--dark);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      background: #fff;
      border-bottom: 4px solid var(--blue);
      box-shadow: 0 2px 15px rgba(0,0,0,.06);
    }

    .header-inner {
      max-width: 1150px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 75px;
      max-height: 52px;
      object-fit: contain;
    }

    .brand strong {
      display: block;
      color: var(--blue);
      font-size: 16px;
    }

    .brand small {
      color: var(--muted);
    }

    #logoutBtn {
      display: none;
      border: 0;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: 800;
    }

    main {
      width: 100%;
      max-width: 1150px;
      margin: auto;
      padding: 25px 14px 60px;
    }

    .login-wrap {
      min-height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .login-card h1 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .field input,
    .filters input,
    .filters select {
      width: 100%;
      height: 47px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 12px;
      background: #fff;
      outline: none;
    }

    .field input:focus,
    .filters input:focus,
    .filters select:focus {
      border-color: var(--blue);
    }

    #loginBtn {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-weight: 900;
    }

    #loginMessage {
      margin-top: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    #dashboard {
      display: none;
    }

    .top-title {
      margin-bottom: 20px;
    }

    .top-title h1 {
      margin: 0 0 5px;
      font-size: 25px;
    }

    .top-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 25px;
    }

    .filters {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 14px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 15px;
    }

    #refreshBtn {
      border: 0;
      border-radius: 9px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
    }

    .booking-list {
      display: grid;
      gap: 12px;
    }

    .booking-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .booking-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .booking-code {
      font-size: 20px;
      font-weight: 900;
      color: var(--blue);
    }

    .created {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px;
    }

    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 10px;
      font-weight: 900;
    }

    .status.pending {
      background: #fff3c4;
      color: #8a6100;
    }

    .status.paid {
      background: #dcfce7;
      color: #166534;
    }

    .status.completed {
      background: #dbeafe;
      color: #1e40af;
    }

    .status.cancelled,
    .status.failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .booking-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 13px;
    }

    .info span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info strong {
      font-size: 13px;
      word-break: break-word;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 15px;
      margin-top: 15px;
      border-top: 1px solid var(--border);
    }

    .actions button,
    .actions a {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 900;
      text-decoration: none;
    }

    .btn-paid {
      background: #dcfce7;
      color: #166534;
    }

    .btn-completed {
      background: #dbeafe;
      color: #1e40af;
    }

    .btn-cancel {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn-print {
      background: #ede9fe;
      color: #5b21b6;
    }

    .btn-wa {
      background: #25D366;
      color: #fff;
    }

    .empty {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 35px 15px;
      text-align: center;
      color: var(--muted);
    }

    @media(max-width:760px) {
      .stats {
        grid-template-columns: repeat(2,1fr);
      }

      .filters {
        grid-template-columns: 1fr;
      }

      #refreshBtn {
        height: 47px;
      }

      .booking-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .brand img {
        width: 58px;
      }

      .brand strong {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="brand">
      <img src="hsm-logo.png" alt="HSM Transport">

      <div>
        <strong>HSM Transport</strong>
        <small>Dashboard Admin</small>
      </div>
    </div>

    <button id="logoutBtn">
      Keluar
    </button>

  </div>
</header>

<main>

  <section id="loginSection" class="login-wrap">

    <div class="login-card">

      <h1>Login Admin</h1>

      <p>
        Masuk menggunakan akun administrator
        HSM Transport.
      </p>

      <div class="field">
        <label for="adminEmail">
          Email
        </label>

        <input
          id="adminEmail"
          type="email"
          autocomplete="username"
          placeholder="Email admin"
        >
      </div>

      <div class="field">
        <label for="adminPassword">
          Password
        </label>

        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
        >
      </div>

      <button id="loginBtn">
        Masuk
      </button>

      <div id="loginMessage"></div>

    </div>

  </section>

  <section id="dashboard">

    <div class="top-title">
      <h1>Data Booking</h1>

      <p>
        Booking aktif dan riwayat perjalanan
        HSM Transport.
      </p>
    </div>

    <div class="stats">

      <div class="stat">
        <span>MENUNGGU</span>
        <strong id="statPending">0</strong>
      </div>

      <div class="stat">
        <span>LUNAS</span>
        <strong id="statPaid">0</strong>
      </div>

      <div class="stat">
        <span>SELESAI</span>
        <strong id="statCompleted">0</strong>
      </div>

      <div class="stat">
        <span>DIBATALKAN</span>
        <strong id="statCancelled">0</strong>
      </div>

    </div>

    <div class="filters">

      <input
        id="searchInput"
        type="search"
        placeholder="Cari kode booking, nama atau WA..."
      >

      <input
        id="dateFilter"
        type="date"
      >

      <select id="statusFilter">

        <option value="">
          Semua status
        </option>

        <option value="pending">
          Menunggu Pembayaran
        </option>

        <option value="paid">
          Lunas
        </option>

        <option value="completed">
          Selesai
        </option>

        <option value="cancelled">
          Dibatalkan
        </option>

      </select>

      <button id="refreshBtn">
        Refresh
      </button>

    </div>

    <div
      id="bookingList"
      class="booking-list"
    ></div>

  </section>

</main>

<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
