name: Build APK HSM Transport

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Website Files
        run: |
          mkdir -p android-app/www

          find . -maxdepth 1 -type f \
            \( -name '*.html' \
            -o -name '*.js' \
            -o -name '*.css' \
            -o -name '*.png' \
            -o -name '*.jpg' \
            -o -name '*.jpeg' \
            -o -name '*.webp' \
            -o -name '*.svg' \
            -o -name '*.ico' \) \
            -exec cp {} android-app/www/ \;

          test -f android-app/www/index.html
          test -f android-app/www/config.js
          test -f android-app/www/app.js

          echo "Website HSM berhasil disiapkan."

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Generate Android Project
        working-directory: android-app
        run: npx cap add android

      - name: Sync Android Project
        working-directory: android-app
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSM-Transport-Android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
